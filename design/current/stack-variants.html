<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DooDoo · 卡片堆叠</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#EDEAE4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1D1C1A;overflow:hidden}

  .bar{display:flex;align-items:center;gap:16px;padding:13px 22px;background:#FBFAF7;border-bottom:1px solid #E2DED6;height:56px}
  .brand{font-size:14px;font-weight:600;white-space:nowrap}
  .chips{display:flex;gap:6px}
  .chip{border:1px solid #E2DED6;background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:12px;color:#6B6862;cursor:pointer;transition:all .16s}
  .chip:hover{border-color:#CFCAC1}
  .chip.on{background:#1D1C1A;border-color:#1D1C1A;color:#fff}
  .hint{margin-left:auto;font-size:12px;color:#A8A39A;white-space:nowrap}

  .stage{position:relative;height:calc(100% - 56px);display:flex;align-items:center;justify-content:center;overflow:hidden}

  .device{position:relative;flex:0 0 auto;width:390px;height:844px;transform-origin:center center}
  .screen{position:absolute;inset:0;overflow:hidden;border-radius:44px;background:#F7F5F1;box-shadow:0 0 0 1px #DEDBD4,0 30px 70px rgba(0,0,0,.16)}
  .statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600}
  .statusbar i{display:block;width:15px;height:9px;border:.8px solid #1D1C1A;border-radius:2px;position:relative}
  .statusbar i::after{content:"";position:absolute;inset:1.5px;background:#1D1C1A;border-radius:1px}

  .hd{position:absolute;top:52px;left:20px;right:20px;height:34px;display:flex;align-items:center;justify-content:space-between;z-index:50}
  .hd .logo{font-size:21px;font-weight:700;letter-spacing:-.02em}
  .chip-mom{display:flex;align-items:center;gap:3px;font-size:11.5px;color:#7E7A72;border:1px solid #E6E2DA;background:#FBFAF7;border-radius:999px;padding:5px 10px}
  .chip-mom s,.note s{text-decoration:none;color:#3B7A44}

  /* deck 底从 92 降到 44（=屏幕圆角半径，再低层叠边会被圆角裁）：
     卡片向下多长 48pt，tab 与 FAB 改浮在卡片上，不再单独占一条空白 */
  .deck{position:absolute;top:100px;left:0;right:0;bottom:44px}

  .card{position:absolute;left:16px;right:16px;top:0;bottom:0;background:#fff;border-radius:24px;padding:20px 18px 26px;display:flex;flex-direction:column;
        box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px rgba(0,0,0,.045);transform-origin:bottom center}
  .ch{display:flex;justify-content:space-between;align-items:flex-start}
  .dwrap{display:flex;align-items:baseline;gap:6px}
  .mon{font-size:11px;color:#A8A39A;letter-spacing:.08em}
  .dnum{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .wday{font-size:12px;color:#A8A39A}
  .totals{display:flex;align-items:baseline;gap:6px}
  .totals .lbl{font-size:11px;color:#A8A39A}
  .totals .exp{font-size:16px;font-weight:600;color:#C0392B;font-variant-numeric:tabular-nums}
  .hr{height:1px;background:#EFECE5;margin:14px 0 2px}
  .rows{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px}
  .tx{display:flex;align-items:center;gap:12px;padding:11px 0}
  .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 42px}
  .ic img{width:27px;height:27px;display:block}
  .tt{font-size:14px;font-weight:500}
  .ts{font-size:11.5px;color:#A8A39A;margin-top:2px}
  .ta{margin-left:auto;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#B5B1A8;font-size:14px}
  .empty small{font-size:11.5px;color:#C6C2B9}
  .cardfoot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#B0ACA3;padding-top:12px}

  .tabbar{position:absolute;left:16px;bottom:16px;height:42px;display:flex;align-items:center;gap:2px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);box-shadow:0 10px 26px rgba(29,28,26,.14),inset 0 0 0 .5px rgba(29,28,26,.09);z-index:60}
  .tabbar span{width:30px;height:30px;display:grid;place-items:center;color:#8E8A82}
  .tabbar span.on{color:#1D1C1A}
  .fab{position:absolute;right:20px;bottom:13px;width:56px;height:56px;border-radius:50%;background:#1D1C1A;color:#fff;font-size:25px;font-weight:300;display:grid;place-items:center;box-shadow:0 12px 26px rgba(0,0,0,.26);z-index:60}

  .note{display:none;position:absolute;right:6px;top:-14px;transform:rotate(-3deg);background:#FFF7E0;border:1px solid #EFE2BE;border-radius:5px;padding:5px 10px;font-size:11px;color:#8A6D2F;box-shadow:0 3px 8px rgba(0,0,0,.09);z-index:6;white-space:nowrap}
  .card.cur .note{display:block}

  /* 叠层通用：后层是真实卡片，只露出底边；靠每层自带的窄投影分层 */
  .device:not(.v-base) .lay1,
  .device:not(.v-base) .lay2,
  .device:not(.v-base) .lay3,
  .device:not(.v-base) .lay4{background:#fff;box-shadow:0 1px 0 rgba(29,28,26,.10),0 4px 8px rgba(29,28,26,.05),inset 0 0 0 1px rgba(29,28,26,.11)}
  .device:not(.v-base) .lay3{box-shadow:0 1px 0 rgba(29,28,26,.10),0 6px 16px rgba(29,28,26,.10),inset 0 0 0 1px rgba(29,28,26,.11)}
  .device:not(.v-base) .lay1>*,
  .device:not(.v-base) .lay2>*,
  .device:not(.v-base) .lay3>*,
  .device:not(.v-base) .lay4>*{opacity:0;transition:opacity .16s}
  .layX{opacity:0;pointer-events:none;z-index:5}

  /* 变体一：竖叠卡堆 —— 12pt 一层，共 36pt */
  .v-pile .lay0{left:16px;right:16px;top:0;bottom:36px;z-index:40;background:#fff;box-shadow:0 3px 5px rgba(29,28,26,.05)}
  .v-pile .lay1{left:16px;right:16px;top:0;bottom:24px;z-index:30}
  .v-pile .lay2{left:16px;right:16px;top:0;bottom:12px;z-index:20}
  .v-pile .lay3{left:16px;right:16px;top:0;bottom:0;z-index:10}
  .v-pile .lay4{display:none}

  /* 变体二：散叠 —— 每层先内缩再旋转错位，保证散开后左右仍有留白 */
  .v-scatter .lay0{left:16px;right:16px;top:0;bottom:30px;z-index:40;background:#fff;box-shadow:0 3px 5px rgba(29,28,26,.05)}
  .v-scatter .lay1{left:26px;right:26px;top:0;bottom:20px;z-index:30}
  .v-scatter .lay2{left:25px;right:25px;top:0;bottom:10px;z-index:20}
  .v-scatter .lay3{left:28px;right:28px;top:0;bottom:0;z-index:10}
  .v-scatter .lay4{display:none}

  /* 变体三：散叠 4 层 —— 每层 10pt，共 40pt */
  .v-scatter4 .lay0{left:16px;right:16px;top:0;bottom:40px;z-index:50;background:#fff;box-shadow:0 3px 5px rgba(29,28,26,.05)}
  .v-scatter4 .lay1{left:26px;right:26px;top:0;bottom:30px;z-index:40}
  .v-scatter4 .lay2{left:25px;right:25px;top:0;bottom:20px;z-index:30}
  .v-scatter4 .lay3{left:28px;right:28px;top:0;bottom:10px;z-index:20}
  .v-scatter4 .lay4{left:27px;right:27px;top:0;bottom:0;z-index:10}

  /* 变体三：单层叠边（最轻一版） */
  .v-thin .lay0{left:16px;right:16px;top:0;bottom:14px;z-index:40;background:#fff;box-shadow:0 3px 5px rgba(29,28,26,.05)}
  .v-thin .lay1{left:16px;right:16px;top:0;bottom:0;z-index:30}
  .v-thin .lay2,.v-thin .lay3,.v-thin .lay4{display:none}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">卡片堆叠 · 真叠层</div>
  <div class="chips" id="chips">
    <button class="chip" data-v="base">基线</button>
    <button class="chip" data-v="pile">竖叠卡堆</button>
    <button class="chip on" data-v="fan">散叠 3 层</button>
    <button class="chip" data-v="fan4">散叠 4 层</button>
    <button class="chip" data-v="thin">单层叠边</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div class="stage"><div class="device" id="dev"></div></div>

<script>
var DAYS = [
  { m:11, d:2, w:'周日', rows:[] },
  { m:11, d:3, w:'周一', rows:[
    { icon:'Croissant', t:'好利来', s:'吃 · 花呗', a:26.00, bg:'#FFF1E6' },
    { icon:'LightRail', t:'地铁', s:'行 · 建行5044', a:4.00, bg:'#EAF2FF' }
  ]},
  { m:11, d:4, w:'周二', rows:[
    { icon:'Cat', t:'麦富迪猫粮', s:'情 · 白条', a:129.00, bg:'#F3EEFF' }
  ]},
  { m:11, d:5, w:'周三', rows:[
    { icon:'HotBeverage', t:'星巴克', s:'吃 · 花呗', a:28.00, bg:'#FFF1E6' },
    { icon:'Taxi', t:'滴滴', s:'行 · 招行', a:19.50, bg:'#EAF2FF' }
  ]},
  { m:11, d:6, w:'今天', rows:[
    { icon:'Croissant', t:'好利来', s:'吃 · 花呗', a:32.00, bg:'#FFF1E6' },
    { icon:'LightRail', t:'地铁', s:'行 · 建行5044', a:4.00, bg:'#EAF2FF' },
    { icon:'Cat', t:'麦富迪猫粮', s:'情 · 白条', a:129.00, bg:'#F3EEFF' }
  ]}
];
var VARIANTS = {
  base:{ name:'基线', note:'现在的实现，单张卡片，无叠层', mode:'carousel', cls:'v-base' },
  pile:{ name:'竖叠卡堆', note:'前卡压住 3 张后卡，底边每 12pt 露一层，共 36pt', mode:'pile', cls:'v-pile' },
  fan:{ name:'散叠 3 层', note:'后层内缩 9~12pt，旋转 0.9°~1.3°，错位 ±5pt；共 30pt', mode:'scatter', decor:'scatter', cls:'v-scatter' },
  fan4:{ name:'散叠 4 层', note:'同样的错位规律多压一层，共 40pt；卡片比 3 层矮 10pt', mode:'scatter', decor:'scatter4', cls:'v-scatter4' },
  thin:{ name:'单层叠边', note:'只露 1 层 14pt 底边，最轻', mode:'thin', cls:'v-thin' }
};
var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function money(n){ return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function pad2(n){ return String(n).padStart(2,'0'); }

function cardHTML(day, i, last){
  var sum = day.rows.reduce(function(a,r){ return a + r.a; }, 0);
  var rows = day.rows.length
    ? day.rows.map(function(r){
        return '<div class="tx"><div class="ic" style="background:' + r.bg + '">'
          + '<img src="../../assets/emoji/picked/' + r.icon + '.png" alt="">'
          + '</div><div><div class="tt">' + r.t + '</div><div class="ts">' + r.s + '</div></div>'
          + '<div class="ta">−¥' + money(r.a) + '</div></div>';
      }).join('')
    : '<div class="empty">没花钱的一天 :)<small>右滑可以看到昨天之前</small></div>';
  var head = '<div class="ch"><div class="dwrap"><span class="mon">' + MON[day.m-1] + '</span>'
    + '<span class="dnum">' + pad2(day.d) + '</span><span class="wday">' + day.w + '</span></div>'
    + (sum > 0 ? '<div class="totals"><span class="lbl">支出</span><span class="exp">−¥' + money(sum) + '</span></div>' : '')
    + '</div>';
  var foot = '';
  return '<div class="card">'
    + '<span class="note">较上月 <s>↘ 12.4%</s></span>'
    + head + '<div class="hr"></div><div class="rows">' + rows + '</div>' + foot + '</div>';
}

var dev = document.getElementById('dev');
var cardsHTML = '';
for (var i = 0; i < DAYS.length; i++) cardsHTML += cardHTML(DAYS[i], i, DAYS.length - 1);

dev.innerHTML = '<div class="screen">'
  + '<div class="statusbar"><span>9:41</span><span><i></i></span></div>'
  + '<div class="hd"><span class="logo">DooDoo</span></div>'
  + '<div class="deck">' + cardsHTML + '</div>'
  + '<div class="tabbar">'
  +   '<span class="on"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span>'
  +   '<span><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5.5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4"/></svg></span>'
  +   '<span><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></span>'
  + '</div><div class="fab">+</div></div>';

var deck = dev.querySelector('.deck');
var cards = [].slice.call(dev.querySelectorAll('.card'));
var idx = cards.length - 1, dx = 0, down = false, sx = 0, sy = 0, axis = null, lx = 0, lt = 0, vel = 0, mode = 'pile', decor = 'scatter';

var LAYCLS = { '0':'lay0', '-1':'lay1', '-2':'lay2', '-3':'lay3', '-4':'lay4' };
function rel(){
  cards.forEach(function(c, i){ c.dataset.rel = i - idx; });
}
function paint(){
  cards.forEach(function(c){
    var r = +c.dataset.rel;
    c.className = 'card ' + (LAYCLS[r] || (r > 0 ? 'layX' : 'layX'));
    c.classList.toggle('cur', r === 0);
  });
}

var DECOR = {
  pile:{ r:[-0.45,0.5,-0.35], x:[0,0,0], fr:[2.4,-3.2,4.4], fx:[0,0,0], lift:[6,4,2] },
  scatter:{ r:[-1.0,0.9,-1.3], x:[-5,4,-4], fr:[1.0,-1.2,1.4], fx:[-2,2,-2], lift:[4,3,2] },
  scatter4:{ r:[-1.0,0.9,-1.3,1.1], x:[-5,4,-4,3], fr:[1.0,-1.2,1.4,-1.2], fx:[-2,2,-2,2], lift:[4,3,2,1] },
  thin:{ r:[-0.4,0,-0.2], x:[0,0,0], fr:[0,0,0], fx:[0,0,0], lift:[7,0,0] }
};
function layout(d, animate, fanP){
  var w = deck.clientWidth;
  var p = fanP || 0;
  var cf = animate ? 'transform .36s cubic-bezier(.32,.72,0,1),opacity .22s,left .36s cubic-bezier(.32,.72,0,1),right .36s cubic-bezier(.32,.72,0,1),top .36s cubic-bezier(.32,.72,0,1),bottom .36s cubic-bezier(.32,.72,0,1)' : 'none';
  var dc = DECOR[decor] || DECOR.pile;
  cards.forEach(function(card){
    var r = +card.dataset.rel, tr;
    card.style.transition = cf;
    if (mode === 'carousel'){
      tr = 'translateX(' + (r * w + d) + 'px)';
    } else if (r === 0){
      tr = 'translateX(' + d + 'px) rotate(' + (d / 110) + 'deg)';
    } else if (r < 0 && r >= -4){
      var k = -r;
      tr = 'translateX(' + (dc.x[k-1] + p * dc.fx[k-1]) + 'px)'
         + ' translateY(' + (-dc.lift[k-1] * peelP) + 'px)'
         + ' rotate(' + (dc.r[k-1] + p * dc.fr[k-1]) + 'deg)';
    } else {
      tr = 'translateX(420px)';
    }
    card.style.transform = tr;
  });
}
var peelP = 0;

function settle(){
  var w = deck.clientWidth;
  var moved = Math.abs(dx) > w * 0.22 || Math.abs(vel) > 0.55;
  if (moved && dx > 0 && idx > 0) idx--;
  else if (moved && dx < 0 && idx < cards.length - 1) idx++;
  dx = 0; vel = 0; peelP = 0;
  rel(); paint(); layout(0, true, 0);
}

function scaleFactor(){ return dev.getBoundingClientRect().width / 390; }

dev.addEventListener('pointerdown', function(e){
  down = true; sx = e.clientX; sy = e.clientY; axis = null; lx = 0; lt = performance.now(); vel = 0;
  cards.forEach(function(c){ c.style.transition = 'none'; });
});
window.addEventListener('pointermove', function(e){
  if (!down) return;
  var s = scaleFactor() || 1;
  var d = (e.clientX - sx) / s, dy = (e.clientY - sy) / s;
  if (!axis && (Math.abs(d) > 6 || Math.abs(dy) > 6)) axis = Math.abs(d) > Math.abs(dy) ? 'x' : 'y';
  if (axis !== 'x') return;
  dx = d;
  if ((dx > 0 && idx === 0) || (dx < 0 && idx === cards.length - 1)) dx *= 0.30;
  var now = performance.now();
  if (now - lt > 16){ vel = (dx - lx) / (now - lt); lx = dx; lt = now; }
  var w = deck.clientWidth;
  var p = (mode === 'scatter' || mode === 'pile') ? Math.min(1, Math.abs(dx) / (w * 0.45)) : 0;
  peelP = Math.min(1, Math.abs(dx) / (w * 0.5));
  layout(dx, false, p);
});
window.addEventListener('pointerup', function(){ if (!down) return; down = false; if (axis !== 'x'){ dx = 0; peelP = 0; layout(0, true, 0); return; } settle(); });
window.addEventListener('pointercancel', function(){ if (!down) return; down = false; dx = 0; peelP = 0; layout(0, true, 0); });

var hintEl = document.getElementById('hint');
function setVariant(id){
  var v = VARIANTS[id] || VARIANTS.pile;
  mode = v.mode;
  decor = v.decor || v.mode;
  dev.className = 'device ' + v.cls;
  idx = cards.length - 1; dx = 0; vel = 0; peelP = 0;
  rel(); paint(); layout(0, false, 0);
  hintEl.textContent = v.name + ' · ' + v.note;
}
document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  [].slice.call(this.children).forEach(function(c){ c.classList.toggle('on', c === b); });
  setVariant(b.dataset.v);
});

function fit(){
  var s = Math.min((window.innerWidth - 40) / 390, (window.innerHeight - 56 - 40) / 844, 1);
  dev.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();
setVariant('fan');
</script>
</body>
</html>
