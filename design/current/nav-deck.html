<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DooDoo · 导航层级 · 卡堆</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#EDEAE4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1D1C1A;display:flex;flex-direction:column;align-items:center}

  .bar{width:100%;height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #E2DFD9;background:#F4F1EC;overflow:hidden;z-index:5}
  .brand{font-size:13px;font-weight:650;white-space:nowrap}
  .chips{display:flex;gap:6px;flex:0 0 auto}
  .chip{border:1px solid #DEDAD2;background:#FBFAF7;color:#4A4741;font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer}
  .chip.on{background:#1D1C1A;color:#fff;border-color:#1D1C1A}
  .hint{margin-left:auto;font-size:11.5px;color:#8A867D;line-height:1.45;max-width:520px;overflow:hidden}

  .stage{flex:1;min-width:0;min-height:0;width:100%;position:relative;overflow:hidden}
  .device{position:absolute;left:50%;top:20px;margin-left:-195px;width:390px;height:844px;transform-origin:top center}
  .screen{position:absolute;inset:0;overflow:hidden;border-radius:44px;background:#F7F5F1;box-shadow:0 0 0 1px #DAD6CE,0 30px 70px rgba(0,0,0,.16)}

  .statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;z-index:90}
  .statusbar i{display:block;width:15px;height:9px;border:.8px solid #1D1C1A;border-radius:2px;position:relative}
  .statusbar i::after{content:"";position:absolute;inset:1.5px;background:#1D1C1A;border-radius:1px}

  .hd{position:absolute;top:52px;left:20px;right:20px;height:34px;display:flex;align-items:center;z-index:50}
  .hd .logo{font-size:21px;font-weight:700;letter-spacing:-.02em}

  /* 卡堆：4 层，后层每层 10pt，共 30pt 的层厚带落在屏幕底部 */
  .deck{position:absolute;top:100px;left:0;right:0;bottom:var(--db,8px)}

  .card{position:absolute;background:#fff;border-radius:24px;transform-origin:bottom center}
  .c0{left:16px;right:16px;top:0;bottom:38px;z-index:40;padding:20px 18px 24px;display:flex;flex-direction:column;
      box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px rgba(0,0,0,.05)}
  .c1{left:26px;right:26px;top:0;bottom:28px;z-index:30;transform:translateX(-5px) rotate(-1deg)}
  .c2{left:25px;right:25px;top:0;bottom:18px;z-index:20;transform:translateX(4px) rotate(.9deg)}
  .c3{left:28px;right:28px;top:0;bottom:8px;z-index:10;transform:translateX(-4px) rotate(-1.3deg)}
  .c1,.c2,.c3{background:#FDFCF8;
      box-shadow:0 1px 0 rgba(29,28,26,.16),0 4px 10px rgba(29,28,26,.08),inset 0 0 0 1px rgba(29,28,26,.14)}

  .ch{display:flex;justify-content:space-between;align-items:flex-start}
  .dwrap{display:flex;align-items:baseline;gap:6px}
  .mon{font-size:11px;color:#A8A39A;letter-spacing:.08em}
  .dnum{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .wday{font-size:12px;color:#A8A39A}
  .totals{display:flex;align-items:baseline;gap:6px}
  .totals .lbl{font-size:11px;color:#A8A39A}
  .totals .exp{font-size:16px;font-weight:600;color:#C0392B;font-variant-numeric:tabular-nums}
  .hr{height:1px;background:#EFECE5;margin:14px 0 2px}
  .rows{flex:1}
  .tx{display:flex;align-items:center;gap:12px;padding:10px 0}
  .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 42px}
  .ic img{width:27px;height:27px;display:block}
  .tt{font-size:14px;font-weight:500}
  .ts{font-size:11.5px;color:#A8A39A;margin-top:2px}
  .ta{margin-left:auto;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .cardfoot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#B0ACA3;padding-top:12px}

  /* 导航 */
  .nav{position:absolute;left:16px;bottom:var(--nb,24px);height:40px;z-index:60;
       display:flex;align-items:center;gap:1px;padding:0 6px;border-radius:20px}
  .nav .t{width:38px;height:34px;display:grid;place-items:center;border-radius:17px;position:relative}
  .fab{position:absolute;right:18px;bottom:var(--fb,32px);width:52px;height:52px;border-radius:50%;z-index:60;display:grid;place-items:center}

  /* 旧：白玻璃，落在卡堆外 */
  .d0 .nav{background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
    box-shadow:0 8px 22px rgba(29,28,26,.13),inset 0 0 0 .5px rgba(29,28,26,.08)}
  .d0 .nav .t{color:#8E8A82}
  .d0 .nav .t.on{color:#1D1C1A}
  .d0 .nav .t.on::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:#1D1C1A}
  .d0 .fab{background:#1D1C1A;color:#fff;box-shadow:0 10px 22px rgba(29,28,26,.26)}

  /* 墨键：压在层厚带上 */
  .d1 .nav,.d2 .nav{background:#1D1C1A;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.10),0 2px 4px rgba(29,28,26,.20),0 14px 30px rgba(29,28,26,.28)}
  .d1 .nav .t,.d2 .nav .t{color:rgba(255,255,255,.52)}
  .d1 .nav .t.on,.d2 .nav .t.on{color:#fff;background:rgba(255,255,255,.14)}
  .d1 .fab,.d2 .fab{background:#1D1C1A;color:#fff;box-shadow:0 2px 4px rgba(29,28,26,.20),0 14px 30px rgba(29,28,26,.26)}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">导航层级 · 卡堆</div>
  <div class="chips" id="chips">
    <button class="chip" data-v="d0">D0 落在卡堆外（旧）</button>
    <button class="chip on" data-v="d1">D1 压穿层厚带</button>
    <button class="chip" data-v="d2">D2 只压前卡</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div class="stage"><div class="device" id="dev"></div></div>

<script>
var ICO = {
  flow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  wallet:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10.5h18M16 15h2"/></svg>',
  chart:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 19V11M12 19V6M19 19v-5"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>'
};
var TX = [
  { ic:'Croissant', t:'好利来', s:'吃 · 花呗', a:'32.00', bg:'#FFF1E6' },
  { ic:'LightRail', t:'地铁', s:'行 · 建行5044', a:'4.00', bg:'#EAF2FF' },
  { ic:'Cat', t:'麦富迪猫粮', s:'情 · 白条', a:'129.00', bg:'#F3EEFF' },
  { ic:'HotBeverage', t:'星巴克', s:'吃 · 花呗', a:'28.00', bg:'#FFF1E6' }
];
function cardHTML(){
  var rows = TX.map(function(r){
    return '<div class="tx"><div class="ic" style="background:' + r.bg + '">'
      + '<img src="../../assets/emoji/picked/' + r.ic + '.png" alt="">'
      + '</div><div><div class="tt">' + r.t + '</div><div class="ts">' + r.s + '</div></div>'
      + '<div class="ta">−¥' + r.a + '</div></div>';
  }).join('');
  return '<div class="card c0">'
    + '<div class="ch"><div class="dwrap"><span class="mon">NOV</span><span class="dnum">06</span><span class="wday">今天</span></div>'
    + '<div class="totals"><span class="lbl">支出</span><span class="exp">−¥193.00</span></div></div>'
    + '<div class="hr"></div><div class="rows">' + rows + '</div>'
    + '<div class="cardfoot"><span>今天 · 11月6日</span><span>4 笔</span></div></div>';
}
var BACK = '<div class="card c1"></div><div class="card c2"></div><div class="card c3"></div>';
var NAVBAR = '<div class="nav">'
  + '<span class="t on">' + ICO.flow + '</span>'
  + '<span class="t">' + ICO.wallet + '</span>'
  + '<span class="t">' + ICO.chart + '</span></div>';
var FABB = '<div class="fab">' + ICO.plus + '</div>';

/* db=deck底距 nb=导航底距 fb=FAB底距 */
var V = {
  d0:{ db:44, nb:16, fb:18,
    hint:'旧：卡片整体上移 44pt 给 tab 让位。tab 落在层厚带下方 14pt 的背景上，不碰任何一层卡。' },
  d1:{ db:8, nb:24, fb:30,
    hint:'压在层厚带上：tab 从卡面一直压到第 3 层的边上，左侧 14pt 层厚被它吃掉；第 4 层底边在它下方还露 16pt。遮住多层 = 在多层之上。' },
  d2:{ db:8, nb:52, fb:58,
    hint:'只压前卡：tab 底边停在前卡底边上方 14pt，30pt 层厚带完整露出。层级干净，但 tab 被读成前卡里的元素，不是全局导航。' }
};
var dev = document.getElementById('dev');
var hintEl = document.getElementById('hint');
var cur = 'd1';
function render(){
  var v = V[cur];
  dev.innerHTML = '<div class="screen ' + cur + '" style="--db:' + v.db + 'px;--nb:' + v.nb + 'px;--fb:' + v.fb + 'px">'
    + '<div class="statusbar"><span>9:41</span><span><i></i></span></div>'
    + '<div class="hd"><span class="logo">DooDoo</span></div>'
    + '<div class="deck">' + BACK + cardHTML() + '</div>' + NAVBAR + FABB + '</div>';
  hintEl.textContent = v.hint;
}
document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  [].slice.call(this.children).forEach(function(c){ c.classList.toggle('on', c === b); });
  cur = b.dataset.v; render();
});
function fit(){
  var s = Math.min((window.innerWidth - 40) / 390, (window.innerHeight - 56 - 40) / 844, 1);
  dev.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
render(); fit();
</script>
</body>
</html>
