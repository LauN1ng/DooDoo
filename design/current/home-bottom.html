<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DooDoo · 底部导航方案</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#EFECE7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1D1C1A;display:flex;flex-direction:column;align-items:center}

  .bar{width:100%;height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #E2DFD9;background:#F4F1EC;overflow:hidden}
  .brand{font-size:13px;font-weight:650;white-space:nowrap}
  .chips{display:flex;gap:6px;flex:0 0 auto}
  .chip{border:1px solid #DEDAD2;background:#FBFAF7;color:#4A4741;font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.16s;white-space:nowrap}
  .chip.on{background:#1D1C1A;color:#fff;border-color:#1D1C1A}
  .hint{margin-left:auto;font-size:11.5px;color:#8A867D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}
  .warn{margin-left:10px;font-size:11px;color:#B4443A;background:#FBEDEB;border:1px solid #EFD5D1;border-radius:999px;padding:4px 10px;white-space:nowrap}

  .stage{flex:1;min-width:0;min-height:0;width:100%;position:relative;overflow:hidden}
  .device{position:absolute;left:50%;top:24px;margin-left:-195px;width:390px;height:844px;transform-origin:top center}
  .screen{position:absolute;inset:0;overflow:hidden;border-radius:44px;background:#F7F5F1;box-shadow:0 0 0 1px #DAD6CE,0 30px 70px rgba(0,0,0,.16)}

  .statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-size:13px;font-weight:600}
  .statusbar i{display:block;width:22px;height:11px;border:1px solid rgba(29,28,26,.35);border-radius:3px;position:relative}
  .statusbar i::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:70%;background:#1D1C1A;border-radius:1.5px}

  .hd{position:absolute;top:58px;left:20px;right:20px;height:34px;display:flex;align-items:center;z-index:50}
  .hd .logo{font-size:21px;font-weight:700;letter-spacing:-.02em}

  /* 卡片区：底部留白随方案变化（--deckbottom） */
  .deck{position:absolute;left:0;right:0;top:104px;bottom:var(--deckbottom,80px)}

  /* 前卡 bottom:30，后层层层更低 10pt——后层才能从底下露出来 */
  .card{position:absolute;left:16px;right:16px;top:0;bottom:30px;z-index:40;background:#fff;border-radius:24px;padding:20px 18px 26px;display:flex;flex-direction:column;
        box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px rgba(0,0,0,.045);transform-origin:bottom center}
  .card .note{position:absolute;right:6px;top:-11px;transform:rotate(-3deg);background:#FFF7E0;border:1px solid #EFE2BE;border-radius:5px;padding:5px 10px;font-size:11px;color:#8A6D2F;box-shadow:0 3px 8px rgba(0,0,0,.09);z-index:6;white-space:nowrap}
  .card .note s{text-decoration:none;color:#3B7A44}

  .lay{position:absolute;left:16px;right:16px;top:0;background:#fff;box-shadow:0 1px 0 rgba(29,28,26,.10),0 4px 8px rgba(29,28,26,.05),inset 0 0 0 1px rgba(29,28,26,.11)}
  .lay1{left:26px;right:26px;bottom:20px;z-index:30;border-radius:24px;transform:rotate(.9deg)}
  .lay2{left:25px;right:25px;bottom:10px;z-index:20;border-radius:24px;transform:rotate(-1.3deg)}
  .lay3{left:28px;right:28px;bottom:0;z-index:10;border-radius:24px}

  /* D：tab 长在卡片里，卡内底部要留出 78pt */
  .deck.dmode .card{padding-bottom:78px}

  .ch{display:flex;justify-content:space-between;align-items:flex-start}
  .dwrap{display:flex;align-items:baseline;gap:6px}
  .mon{font-size:11px;color:#A8A39A;letter-spacing:.08em}
  .dnum{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .wday{font-size:12px;color:#A8A39A}
  .totals{display:flex;align-items:baseline;gap:6px}
  .totals .lbl{font-size:11px;color:#A8A39A}
  .totals .exp{font-size:16px;font-weight:600;color:#C0392B;font-variant-numeric:tabular-nums}
  .hr{height:1px;background:#EFECE5;margin:14px 0 2px}
  .rows{flex:1;overflow-y:auto}
  .tx{display:flex;align-items:center;gap:12px;padding:11px 0}
  .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 42px;font-size:19px}
  .tt{font-size:14px;font-weight:500}
  .ts{font-size:11.5px;color:#A8A39A;margin-top:2px}
  .ta{margin-left:auto;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .cardfoot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#B0ACA3;padding-top:12px}

  /* ============ 方案 A：整宽 Dock ============ */
  .dock{
    position:absolute;left:16px;right:16px;bottom:14px;height:54px;z-index:60;
    display:flex;align-items:center;gap:2px;padding:0 7px;
    border-radius:27px;background:rgba(255,255,255,.80);
    -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
    box-shadow:0 10px 30px rgba(29,28,26,.15),inset 0 0 0 .5px rgba(29,28,26,.08);
  }
  .dock .t{flex:1;height:44px;display:grid;place-items:center;color:#8E8A82;border-radius:22px;position:relative}
  .dock .t.on{color:#1D1C1A}
  .dock .t.on::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:#1D1C1A}
  .dock .fab{
    width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:#1D1C1A;color:#fff;
    display:grid;place-items:center;margin-left:2px;
    box-shadow:0 6px 14px rgba(29,28,26,.26);
  }

  /* ============ 方案 B：双角悬浮，等高同轴 ============ */
  .pill3{
    position:absolute;left:16px;bottom:16px;height:54px;z-index:60;
    display:flex;align-items:center;gap:2px;padding:0 7px;border-radius:27px;
    background:rgba(255,255,255,.80);
    -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
    box-shadow:0 10px 30px rgba(29,28,26,.15),inset 0 0 0 .5px rgba(29,28,26,.08);
  }
  .pill3 .t{width:44px;height:44px;display:grid;place-items:center;color:#8E8A82;border-radius:22px;position:relative}
  .pill3 .t.on{color:#1D1C1A}
  .pill3 .t.on::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:#1D1C1A}
  .fab56{
    position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;z-index:60;
    background:#1D1C1A;color:#fff;display:grid;place-items:center;
    box-shadow:0 10px 24px rgba(29,28,26,.28);
  }

  /* ============ 方案 C：右下竖排胶囊 ============ */
  .vpill{
    position:absolute;right:16px;bottom:16px;z-index:60;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;
    border-radius:28px;background:rgba(255,255,255,.80);
    -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
    box-shadow:0 10px 30px rgba(29,28,26,.15),inset 0 0 0 .5px rgba(29,28,26,.08);
  }
  .vpill .fab{width:40px;height:40px;border-radius:50%;background:#1D1C1A;color:#fff;display:grid;place-items:center;margin-bottom:1px}
  .vpill .sep{width:24px;height:1px;background:rgba(29,28,26,.10);margin:1px 0 2px}
  .vpill .t{width:40px;height:34px;display:grid;place-items:center;color:#8E8A82;position:relative;border-radius:17px}
  .vpill .t.on{color:#1D1C1A;background:rgba(29,28,26,.06)}

  /* ============ 方案 D：卡内工具条 ============ */
  .inbar{
    position:absolute;left:18px;right:18px;bottom:14px;height:46px;z-index:6;
    display:flex;align-items:center;gap:2px;
    border-top:1px solid #EFECE5;padding-top:10px;
  }
  .inbar .t{flex:1;height:36px;display:grid;place-items:center;color:#B0ACA3;border-radius:18px}
  .inbar .t.on{color:#1D1C1A}
  .inbar .fab{
    width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#1D1C1A;color:#fff;
    display:grid;place-items:center;margin-left:4px;box-shadow:0 5px 12px rgba(29,28,26,.24);
  }

  /* ============ 方案 E：底部一行，无容器（文字 tab） ============ */
  .flatbar{
    position:absolute;left:26px;right:16px;bottom:20px;height:40px;z-index:60;
    display:flex;align-items:center;gap:18px;
  }
  .flatbar .t{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#A8A39A;font-weight:500}
  .flatbar .t.on{color:#1D1C1A;font-weight:650}
  .flatbar .fab{
    margin-left:auto;width:48px;height:48px;border-radius:50%;background:#1D1C1A;color:#fff;
    display:grid;place-items:center;box-shadow:0 8px 20px rgba(29,28,26,.26);
  }
</style>
</head>
<body>
<div class="bar">
  <div class="brand">首页 · 底部导航（旧稿·层级假设已推翻）</div>
  <div class="chips" id="chips">
    <button class="chip on" data-v="a">A 整宽 Dock</button>
    <button class="chip" data-v="b">B 双角悬浮</button>
    <button class="chip" data-v="c">C 右下竖排</button>
    <button class="chip" data-v="d">D 卡内工具条</button>
    <button class="chip" data-v="e">E 文字底栏</button>
  </div>
  <div class="hint" id="hint"></div>
  <span class="warn">五版都把 tab 长在卡片层 → 见 nav-layer2.html</span>
</div>
<div class="stage"><div class="device" id="dev"></div></div>

<script>
var ICON = {
  flow:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  cal:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5.5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4"/></svg>',
  chart:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V11M12 19V6M19 19v-5"/></svg>',
  me:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>',
  plus:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

var TX = [
  { ic:'🥐', t:'好利来', s:'吃 · 花呗', a:'32.00', bg:'#FFF1E6' },
  { ic:'🚇', t:'地铁', s:'行 · 建行5044', a:'4.00', bg:'#EAF2FF' },
  { ic:'🐱', t:'麦富迪猫粮', s:'情 · 白条', a:'129.00', bg:'#F3EEFF' }
];

function cardHTML(navHtml){
  var rows = TX.map(function(r){
    return '<div class="tx"><div class="ic" style="background:' + r.bg + '">' + r.ic + '</div>'
      + '<div><div class="tt">' + r.t + '</div><div class="ts">' + r.s + '</div></div>'
      + '<div class="ta">−¥' + r.a + '</div></div>';
  }).join('');
  return '<div class="card">'
    + '<span class="note">较上月 <s>↘ 12.4%</s></span>'
    + '<div class="ch"><div class="dwrap"><span class="mon">NOV</span><span class="dnum">06</span><span class="wday">今天</span></div>'
    + '<div class="totals"><span class="lbl">支出</span><span class="exp">−¥165.00</span></div></div>'
    + '<div class="hr"></div><div class="rows">' + rows + '</div>'
    + '<div class="cardfoot"><span>今天 · 11月6日</span><span>3 笔</span></div>'
    + (navHtml || '')
    + '</div>';
}

var NAV = {
  a: '<div class="dock">'
     + '<span class="t on">' + ICON.flow + '</span>'
     + '<span class="t">' + ICON.cal + '</span>'
     + '<span class="t">' + ICON.chart + '</span>'
     + '<span class="t">' + ICON.me + '</span>'
     + '<span class="fab">' + ICON.plus + '</span></div>',
  b: '<div class="pill3">'
     + '<span class="t on">' + ICON.flow + '</span>'
     + '<span class="t">' + ICON.cal + '</span>'
     + '<span class="t">' + ICON.chart + '</span></div>'
     + '<div class="fab56">' + ICON.plus + '</div>',
  c: '<div class="vpill">'
     + '<span class="fab">' + ICON.plus + '</span>'
     + '<span class="sep"></span>'
     + '<span class="t on">' + ICON.flow + '</span>'
     + '<span class="t">' + ICON.cal + '</span>'
     + '<span class="t">' + ICON.chart + '</span></div>',
  d: '<div class="inbar">'
     + '<span class="t on">' + ICON.flow + '</span>'
     + '<span class="t">' + ICON.cal + '</span>'
     + '<span class="t">' + ICON.chart + '</span>'
     + '<span class="fab">' + ICON.plus + '</span></div>',
  e: '<div class="flatbar">'
     + '<span class="t on">' + ICON.flow + '流水</span>'
     + '<span class="t">' + ICON.cal + '日历</span>'
     + '<span class="t">' + ICON.chart + '统计</span>'
     + '<span class="fab">' + ICON.plus + '</span></div>'
};

var NOTES = {
  a:{ deck:'80px', hint:'一条收口，重心稳；+ 并入 Dock 不再孤立；可扩到 5 项。代价：底部常驻占 68pt' },
  b:{ deck:'72px', hint:'改动最小：pill 与 + 等高、同轴、底对齐。代价：中间仍空一大块，两个元件各守一角' },
  c:{ deck:'172px', hint:'只占右下一角，最省横向空间。代价：竖向排到 168pt 高，卡片被压短；只能放 3 项，且竖向 tab 反 iOS 习惯' },
  d:{ deck:'44px', hint:'tab 长在卡片的纸里，像抽屉；+ 也在卡内。代价：卡片可写区少 78pt，且切到空日卡 tab 仍在卡上' },
  e:{ deck:'72px', hint:'无容器、带文字标签，可发现性最好。代价：文字+图标占宽，最多 3-4 项；失去 Dock 的整体感' }
};

var dev = document.getElementById('dev');
var hintEl = document.getElementById('hint');
var cur = 'a';

function render(){
  var key = cur;
  var inner = '<div class="screen">'
    + '<div class="statusbar"><span>9:41</span><span><i></i></span></div>'
    + '<div class="hd"><span class="logo">DooDoo</span></div>';
  if (key === 'd'){
    inner += '<div class="deck dmode" style="--deckbottom:' + NOTES.d.deck + '">'
      + '<div class="lay lay3"></div><div class="lay lay2"></div><div class="lay lay1"></div>'
      + cardHTML(NAV.d) + '</div>';
  } else {
    inner += '<div class="deck" style="--deckbottom:' + NOTES[key].deck + '">'
      + '<div class="lay lay3"></div><div class="lay lay2"></div><div class="lay lay1"></div>'
      + cardHTML() + '</div>' + NAV[key];
  }
  inner += '</div>';
  dev.innerHTML = inner;
  hintEl.textContent = NOTES[key].hint;
}

document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  [].slice.call(this.children).forEach(function(c){ c.classList.toggle('on', c === b); });
  cur = b.dataset.v;
  render();
});

function fit(){
  var s = Math.min((window.innerWidth - 40) / 390, (window.innerHeight - 56 - 48) / 844, 1);
  dev.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
render();
fit();
</script>
</body>
</html>
