<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导航层级 · 新旧对照</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#EDEAE4;font-family:-apple-system,"PingFang SC",sans-serif;color:#1D1C1A;padding:22px 26px}
  .row{display:flex;gap:26px;align-items:flex-start}
  .col{width:390px}
  .col img{width:390px;display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
  .cap{font-size:12px;margin-bottom:9px;display:flex;gap:8px;align-items:baseline}
  .cap b{font-size:12.5px}
  .cap span{color:#8A867D}
  .bad{color:#B4443A}
  .good{color:#2F7A48}
</style>
</head>
<body>
<div class="row">
  <div class="col">
    <div class="cap"><b>改前</b><span class="bad">卡片被 tab 挤短 62pt，屏幕底留一条横带</span></div>
    <img src="nl-1.png" alt="">
  </div>
  <div class="col">
    <div class="cap"><b>改后 · 墨键</b><span class="good">卡片铺到距底 12pt，墨键压进卡内 44pt</span></div>
    <img src="nl2-ink.png" alt="">
  </div>
</div>
</body>
</html>
