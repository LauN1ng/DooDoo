<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DooDoo · 单日超量处理</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#EDEAE4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1D1C1A;display:flex;flex-direction:column;align-items:center}

  .bar{width:100%;height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #E2DFD9;background:#F4F1EC;overflow:hidden;z-index:5}
  .brand{font-size:13px;font-weight:650;white-space:nowrap}
  .chips{display:flex;gap:6px}
  .chip{border:1px solid #D8D4CB;background:#fff;border-radius:999px;padding:4px 11px;font-size:11.5px;color:#5F5E5A;cursor:pointer;font-family:inherit}
  .chip.on{background:#1D1C1A;border-color:#1D1C1A;color:#fff}
  .hint{margin-left:auto;font-size:11.5px;color:#8A867D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px}

  .stage{flex:1;min-width:0;min-height:0;width:100%;position:relative;overflow:hidden}
  .device{position:absolute;left:50%;top:16px;margin-left:-195px;width:390px;height:844px;transform-origin:top center}
  .screen{position:absolute;inset:0;overflow:hidden;border-radius:44px;background:#F7F5F1;box-shadow:0 0 0 1px #DAD6CE,0 30px 70px rgba(0,0,0,.16)}
  .statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;z-index:90}
  .statusbar i{display:block;width:15px;height:9px;border:.8px solid #1D1C1A;border-radius:2px;position:relative}
  .statusbar i::after{content:"";position:absolute;inset:1.5px;background:#1D1C1A;border-radius:1px}

  .hd{position:absolute;top:52px;left:20px;right:20px;height:34px;display:flex;align-items:center;justify-content:space-between;z-index:50}
  .hd .logo{font-size:21px;font-weight:700;letter-spacing:-.02em}

  .deck{position:absolute;top:100px;left:0;right:0;bottom:8px}
  .card{position:absolute;left:16px;right:16px;top:0;background:#fff;border-radius:24px;
        padding:20px 18px 24px;display:flex;flex-direction:column;transform-origin:bottom center}
  .lay0{left:16px;right:16px;bottom:38px;z-index:40;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px rgba(0,0,0,.045)}
  .lay1{left:26px;right:26px;bottom:28px;z-index:30;box-shadow:0 1px 0 rgba(29,28,26,.10),0 4px 8px rgba(29,28,26,.05),inset 0 0 0 1px rgba(29,28,26,.11)}
  .lay2{left:25px;right:25px;bottom:18px;z-index:20;box-shadow:0 1px 0 rgba(29,28,26,.10),0 4px 8px rgba(29,28,26,.05),inset 0 0 0 1px rgba(29,28,26,.11)}
  .lay3{left:28px;right:28px;bottom:8px;z-index:10;box-shadow:0 1px 0 rgba(29,28,26,.10),0 6px 16px rgba(29,28,26,.10),inset 0 0 0 1px rgba(29,28,26,.11)}
  .lay1>*,.lay2>*,.lay3>*{opacity:0}
  .layX{opacity:0;pointer-events:none;z-index:5}

  /* 便签：较上月（stack-variants .note 的原样式） */
  .note{display:none;position:absolute;right:6px;top:-14px;transform:rotate(-3deg);background:#FFF7E0;border:1px solid #EFE2BE;border-radius:5px;padding:5px 10px;font-size:11px;color:#8A6D2F;box-shadow:0 3px 8px rgba(0,0,0,.09);z-index:6;white-space:nowrap}
  .note s{text-decoration:none;color:#3B7A44}
  .card.cur .note{display:block}

  .ch{display:flex;justify-content:space-between;align-items:flex-start}
  .dwrap{display:flex;align-items:baseline;gap:6px}
  .mon{font-size:11px;color:#A8A39A;letter-spacing:.08em}
  .dnum{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .wday{font-size:12px;color:#A8A39A}
  .totals{display:flex;align-items:baseline;gap:6px}
  .totals .lbl{font-size:11px;color:#A8A39A}
  .totals .exp{font-size:16px;font-weight:600;color:#C0392B;font-variant-numeric:tabular-nums}
  .hr{height:1px;background:#EFECE5;margin:14px 0 2px}

  .tx{display:flex;align-items:center;gap:12px;padding:11px 0}
  .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 42px}
  .ic img{width:27px;height:27px;display:block}
  .tt{font-size:14px;font-weight:500}
  .ts{font-size:11.5px;color:#A8A39A;margin-top:2px}
  .ta{margin-left:auto;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

  /* A：现状 —— 纯滚动，无边界提示 */
  .rowsA{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px}
  /* B：滚动 + 底部渐隐 + 固定计数条 */
  .rowsB{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px;position:relative;
         -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent 100%);
         mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent 100%)}
  .countbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
            font-size:10.5px;color:#B0ACA3;padding-top:9px;border-top:1px solid #F2EFE9}
  /* C：截断 + 入口 */
  .rowsC{flex:0 0 auto;overflow:hidden}
  .more{margin-top:4px;display:flex;align-items:center;justify-content:space-between;
        background:#FAF8F3;border-radius:12px;padding:10px 12px;font-size:12px;color:#6B6862}
  .more b{color:#1D1C1A;font-weight:600}
  .more .go{color:#B0ACA3;font-size:14px}

  .nav{position:absolute;left:16px;bottom:52px;height:36px;z-index:60;
       display:flex;align-items:center;gap:1px;padding:0 6px;border-radius:18px;background:rgba(29,28,26,.88);
       box-shadow:0 10px 22px rgba(29,28,26,.22)}
  .nav .t{width:36px;height:30px;display:grid;place-items:center;border-radius:15px;color:rgba(255,255,255,.5)}
  .nav .t.on{color:#fff;background:rgba(255,255,255,.13)}
  .fab{position:absolute;right:18px;bottom:47px;width:46px;height:46px;border-radius:23px;z-index:60;
       background:#1D1C1A;color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(29,28,26,.22)}

  .vA .rowsA{display:block}
  .vB .rowsB{display:block}
  .vC .rowsC{display:block}
  .rowsA,.rowsB,.rowsC{display:none}
  .countbar{display:none}
  .vB .countbar{display:flex}
</style>
</head>
<body class="vA">
<div class="bar">
  <div class="brand">单日超量（14 笔）</div>
  <div class="chips" id="chips">
    <button class="chip on" data-v="A">A 现状纯滚动</button>
    <button class="chip" data-v="B">B 渐隐 + 计数条</button>
    <button class="chip" data-v="C">C 截断 + 入口</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div class="stage"><div class="device" id="dev"></div></div>

<script>
var ICO = {
  flow:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  wallet:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10.5h18M16 15h2"/></svg>',
  gear:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>',
  plus:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/>'
};
var ROWS = [
  { icon:'Croissant',       t:'瑞幸咖啡',   s:'吃 · 花呗',     a:18.00,  bg:'#FFF1E6' },
  { icon:'LightRail',       t:'地铁',       s:'行 · 建行5044', a:4.00,   bg:'#EAF2FF' },
  { icon:'Hamburger',       t:'麦当劳',     s:'吃 · 招行',     a:42.00,  bg:'#FFF1E6' },
  { icon:'ShoppingCart',    t:'便利店',     s:'情 · 支付宝',   a:8.50,   bg:'#F3EEFF' },
  { icon:'HotBeverage',     t:'星巴克',     s:'吃 · 花呗',     a:35.00,  bg:'#FFF1E6' },
  { icon:'Taxi',            t:'滴滴',       s:'行 · 招行',     a:26.00,  bg:'#EAF2FF' },
  { icon:'ShoppingBasket',  t:'超市',       s:'情 · 建行5044', a:168.40, bg:'#EAF7EE' },
  { icon:'Apple',           t:'水果',       s:'情 · 支付宝',   a:45.90,  bg:'#EAF7EE' },
  { icon:'FirstAidKit',     t:'药店',       s:'情 · 白条',     a:62.00,  bg:'#FDEEF0' },
  { icon:'Sandwich',        t:'食堂',       s:'吃 · 建行5044', a:25.00,  bg:'#FFF1E6' },
  { icon:'Coffee',          t:'咖啡',       s:'吃 · 支付宝',   a:19.00,  bg:'#FFF1E6' },
  { icon:'LightRail',       t:'地铁',       s:'行 · 支付宝',   a:4.00,   bg:'#EAF2FF' },
  { icon:'Car',             t:'停车费',     s:'行 · 招行',     a:10.00,  bg:'#EAF2FF' },
  { icon:'Laundry',         t:'洗衣',       s:'情 · 花呗',     a:35.00,  bg:'#F3EEFF' },
  { icon:'Pizza',           t:'披萨',       s:'吃 · 白条',     a:68.00,  bg:'#FFF1E6' },
  { icon:'Bicycle',         t:'共享单车',   s:'行 · 支付宝',   a:1.50,   bg:'#EAF2FF' },
  { icon:'Bag',             t:'快递',       s:'情 · 花呗',     a:23.80,  bg:'#F3EEFF' },
  { icon:'Cup',             t:'奶茶',       s:'吃 · 支付宝',   a:16.00,  bg:'#FFF1E6' },
  { icon:'Sofa',            t:'纸巾',       s:'情 · 建行5044', a:29.90,  bg:'#EAF7EE' },
  { icon:'Dog',             t:'狗粮',       s:'情 · 白条',     a:119.00, bg:'#F3EEFF' },
  { icon:'Stethoscope',     t:'体检',       s:'情 · 招行',     a:280.00, bg:'#FDEEF0' },
  { icon:'Film',            t:'电影',       s:'情 · 花呗',     a:98.00,  bg:'#F3EEFF' }
];
var DAYS = [
  { m:11, d:5, w:'周三', rows: ROWS.slice(0,4) },
  { m:11, d:6, w:'今天', rows: ROWS }
];
var TOTAL = ROWS.length;
var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function money(n){ return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function pad2(n){ return String(n).padStart(2,'0'); }
function txHTML(r){
  return '<div class="tx"><div class="ic" style="background:' + r.bg + '">'
    + '<img src="../../assets/emoji/picked/' + r.icon + '.png" alt=""></div>'
    + '<div><div class="tt">' + r.t + '</div><div class="ts">' + r.s + '</div></div>'
    + '<div class="ta">−¥' + money(r.a) + '</div></div>';
}

var dev = document.getElementById('dev');
var CARDS = DAYS.map(function(day, di){
  var sum = day.rows.reduce(function(a,r){ return a + r.a; }, 0);
  var rowsHTML = day.rows.map(txHTML).join('');
  var head = '<div class="ch"><div class="dwrap"><span class="mon">' + MON[day.m-1] + '</span>'
    + '<span class="dnum">' + pad2(day.d) + '</span><span class="wday">' + day.w + '</span></div>'
    + '<div class="totals"><span class="lbl">支出</span><span class="exp">−¥' + money(sum) + '</span></div></div>';
  var isCur = (di === DAYS.length - 1);
  var body, foot = '';
  if (isCur) {
    // 三种方案共用同一份数据，结构不同
    body = '<div class="rowsA">' + rowsHTML + '</div>'
         + '<div class="rowsB">' + rowsHTML + '</div>'
         + '<div class="rowsC">' + day.rows.slice(0,8).map(txHTML).join('')
         +   '<div class="more"><span>还有 <b>' + (day.rows.length - 8) + ' 笔</b> · 查看当天全部</span><span class="go">›</span></div>'
         + '</div>';
    foot = '<div class="countbar"><span>' + TOTAL + ' 笔</span><span>向上滑看更多</span></div>';
  } else {
    body = '<div class="rowsA">' + rowsHTML + '</div><div class="rowsB">' + rowsHTML + '</div><div class="rowsC">' + rowsHTML + '</div>';
  }
  return '<div class="card' + (isCur ? ' cur' : '') + '">'
    + '<span class="note">较上月 <s>↘ 12.4%</s></span>'
    + head + '<div class="hr"></div>' + body + foot + '</div>';
}).join('');

dev.innerHTML = '<div class="screen">'
  + '<div class="statusbar"><span>9:41</span><span><i></i></span></div>'
  + '<div class="hd"><span class="logo">DooDoo</span></div>'
  + '<div class="deck">' + CARDS + '</div>'
  + '<div class="nav"><span class="t on">' + ICO.flow + '</span><span class="t">' + ICO.wallet + '</span><span class="t">' + ICO.gear + '</span></div>'
  + '<div class="fab">' + ICO.plus + '</div></div>';

var cards = [].slice.call(dev.querySelectorAll('.card'));
var LAYCLS = { '0':'lay0', '-1':'lay1', '-2':'lay2', '-3':'lay3' };
var DECOR = { r:[-1.0,0.9,-1.3], x:[-5,4,-4], fr:[1.0,-1.2,1.4], fx:[-2,2,-2], lift:[4,3,2] };
var idx = cards.length - 1, dx = 0, down = false, sx = 0, sy = 0, axis = null, lx = 0, lt = 0, vel = 0, peelP = 0;

function rel(){ cards.forEach(function(c,i){ c.dataset.rel = i - idx; }); }
function paint(){
  cards.forEach(function(c){
    var r = +c.dataset.rel;
    c.className = 'card' + (c.dataset.cur ? ' cur' : '') + ' ' + (LAYCLS[r] || 'layX');
  });
}
function layout(d, animate, fanP){
  var p = fanP || 0;
  var cf = animate ? 'transform .36s cubic-bezier(.32,.72,0,1),opacity .22s,left .36s cubic-bezier(.32,.72,0,1),right .36s cubic-bezier(.32,.72,0,1),bottom .36s cubic-bezier(.32,.72,0,1)' : 'none';
  cards.forEach(function(card){
    var r = +card.dataset.rel, tr;
    card.style.transition = cf;
    if (r === 0){
      tr = 'translateX(' + d + 'px) rotate(' + (d/110) + 'deg)';
    } else if (r < 0 && r >= -3){
      var k = -r;
      tr = 'translateX(' + (DECOR.x[k-1] + p*DECOR.fx[k-1]) + 'px)'
         + ' translateY(' + (-DECOR.lift[k-1]*peelP) + 'px)'
         + ' rotate(' + (DECOR.r[k-1] + p*DECOR.fr[k-1]) + 'deg)';
    } else { tr = 'translateX(420px)'; }
    card.style.transform = tr;
  });
}
function settle(){
  var w = dev.querySelector('.deck').clientWidth;
  var moved = Math.abs(dx) > w*0.22 || Math.abs(vel) > 0.55;
  if (moved && dx > 0 && idx > 0) idx--;
  else if (moved && dx < 0 && idx < cards.length-1) idx++;
  dx = 0; vel = 0; peelP = 0;
  rel(); paint(); layout(0, true, 0);
}
function scaleFactor(){ return dev.getBoundingClientRect().width / 390; }

dev.addEventListener('pointerdown', function(e){
  down = true; sx = e.clientX; sy = e.clientY; axis = null; lx = 0; lt = performance.now(); vel = 0;
  cards.forEach(function(c){ c.style.transition = 'none'; });
});
window.addEventListener('pointermove', function(e){
  if (!down) return;
  var s = scaleFactor() || 1;
  var d = (e.clientX - sx)/s, dy = (e.clientY - sy)/s;
  if (!axis && (Math.abs(d) > 6 || Math.abs(dy) > 6)) axis = Math.abs(d) > Math.abs(dy) ? 'x' : 'y';
  if (axis !== 'x') return;
  dx = d;
  if ((dx > 0 && idx === 0) || (dx < 0 && idx === cards.length-1)) dx *= 0.30;
  var now = performance.now();
  if (now - lt > 16){ vel = (dx-lx)/(now-lt); lx = dx; lt = now; }
  var w = dev.querySelector('.deck').clientWidth;
  var p = Math.min(1, Math.abs(dx)/(w*0.45));
  peelP = Math.min(1, Math.abs(dx)/(w*0.5));
  layout(dx, false, p);
});
window.addEventListener('pointerup', function(){
  if (!down) return; down = false;
  if (axis !== 'x'){ dx = 0; peelP = 0; layout(0, true, 0); return; }
  settle();
});
window.addEventListener('pointercancel', function(){ if(!down) return; down=false; dx=0; peelP=0; layout(0,true,0); });

var HINTS = {
  A:'现状：卡内纯滚动，无边界提示 —— 不知道下面还有',
  B:'滚动 + 底部渐隐 + 固定「14 笔 · 向上滑看更多」',
  C:'截断 8 笔 + 「还有 6 笔 · 查看当天全部」入口'
};
function setVariant(v){
  document.body.className = 'v' + v;
  var chips = document.querySelectorAll('.chip');
  for (var i=0;i<chips.length;i++) chips[i].classList.toggle('on', chips[i].dataset.v === v);
  document.getElementById('hint').textContent = HINTS[v];
}
document.getElementById('chips').addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if (c) setVariant(c.dataset.v);
});

// 标记当前卡（画便签用）
cards.forEach(function(c,i){ c.dataset.cur = (i === cards.length-1) ? '1' : ''; });

function fit(){
  var s = Math.min((window.innerWidth-40)/390, (window.innerHeight-52-36)/844, 1);
  dev.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
rel(); paint(); layout(0, false, 0); fit(); setVariant('A');
</script>
</body>
</html>
