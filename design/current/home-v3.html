<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DooDoo · 首页 v3（B 记账行 + 卡堆按天数）</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#EDEAE4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Helvetica,sans-serif;color:#1D1C1A;display:flex;flex-direction:column;align-items:center}

  .bar{width:100%;height:54px;flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid #E2DFD9;background:#F4F1EC;z-index:5;overflow:hidden}
  .brand{font-size:13px;font-weight:650;white-space:nowrap}
  .grp{display:flex;align-items:center;gap:6px;margin-left:auto}
  .lbl{font-size:11px;color:#8A867D;white-space:nowrap}
  .chip{font-size:11.5px;padding:5px 11px;border-radius:999px;background:#fff;color:#5F5E5A;border:1px solid #DFDBD2;cursor:pointer;white-space:nowrap;transition:.16s}
  .chip:hover{border-color:#C9C4B9;color:#1D1C1A}
  .chip.on{background:#1D1C1A;color:#fff;border-color:#1D1C1A;font-weight:600}
  .toggle{font-size:11.5px;color:#6F6B63;display:flex;align-items:center;gap:5px;margin-left:4px;cursor:pointer;white-space:nowrap}
  .toggle input{accent-color:#1D1C1A}
  .readout{font-size:11px;color:#8A867D;margin-left:8px;white-space:nowrap}

  .stage{flex:1;min-width:0;min-height:0;width:100%;position:relative;overflow:hidden}
  .device{position:absolute;left:50%;top:14px;margin-left:-195px;width:390px;height:844px;transform-origin:top center}
  .screen{position:absolute;inset:0;overflow:hidden;border-radius:44px;background:#F7F5F1;box-shadow:0 0 0 1px #DAD6CE,0 30px 70px rgba(0,0,0,.16)}

  .statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;z-index:90}
  .statusbar i{display:block;width:15px;height:9px;border:.8px solid #1D1C1A;border-radius:2px;position:relative}
  .statusbar i::after{content:"";position:absolute;inset:1.5px;background:#1D1C1A;border-radius:1px}
  .hd{position:absolute;top:52px;left:20px;right:20px;height:34px;display:flex;align-items:center;justify-content:space-between;z-index:50}
  .hd .logo{font-size:21px;font-weight:700;letter-spacing:-.02em}
  .tabx{display:flex;align-items:center;padding:2px;border-radius:17px;height:34px;background:#EBE7E0}
  .tabx .t{width:36px;height:30px;border-radius:15px;display:grid;place-items:center;color:rgba(29,28,26,.38);cursor:pointer;transition:background .18s,color .18s}
  .tabx .t.on{background:#fff;color:#1D1C1A;box-shadow:inset 0 0 0 .5px rgba(29,28,26,.10),0 1px 2px rgba(29,28,26,.10)}

  /* 卡堆：top / bottom 固定区域，前卡与后层的 bottom 由层数计算（见 JS） */
  .deck{position:absolute;top:116px;left:0;right:0;bottom:8px;touch-action:pan-y}
  .card{position:absolute;left:16px;right:16px;top:0;background:#fff;border-radius:24px;
        padding:20px 18px 16px;display:flex;flex-direction:column;transform-origin:bottom center;
        box-shadow:0 1px 0 rgba(29,28,26,.10),0 4px 8px rgba(29,28,26,.05),inset 0 0 0 1px rgba(29,28,26,.11)}
  .card.front{box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px rgba(0,0,0,.045)}
  .card.behind>*{opacity:0}

  .ch{display:flex;justify-content:space-between;align-items:flex-start}
  .dwrap{display:flex;align-items:baseline;gap:6px}
  .mon{font-size:11px;color:#A8A39A;letter-spacing:.08em}
  .dnum{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .wday{font-size:12px;color:#A8A39A}
  .totals{display:flex;align-items:baseline;gap:6px}
  .totals .lbl{font-size:11px;color:#A8A39A}
  .totals .exp{font-size:16px;font-weight:600;color:#C0392B;font-variant-numeric:tabular-nums}
  .hr{height:1px;background:#EFECE5;margin:14px 0 2px}
  .rows{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px;min-height:0;scrollbar-width:none;
        -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent 100%);
        mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent 100%)}
  .rows::-webkit-scrollbar{width:0;height:0}
  .note{position:absolute;right:6px;top:-14px;transform:rotate(-3deg);background:#FFF7E0;border:1px solid #EFE2BE;
        border-radius:5px;padding:5px 10px;font-size:11px;color:#8A6D2F;box-shadow:0 3px 8px rgba(0,0,0,.09);z-index:6;white-space:nowrap}
  .note s{text-decoration:none;color:#3B7A44}
  .tx{display:flex;align-items:center;gap:12px;padding:11px 0}
  .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 42px}
  .ic img{width:27px;height:27px;display:block}
  .tt{font-size:14px;font-weight:500}
  .ts{font-size:11.5px;color:#A8A39A;margin-top:2px}
  .ta{margin-left:auto;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#B5B1A8;font-size:13.5px}
  .empty small{font-size:11.5px;color:#C6C2B9}

  /* ===== B 记账行：今天卡的最后一行 ===== */
  .addrow{display:flex;align-items:center;gap:12px;height:56px;flex:0 0 56px;cursor:pointer;margin:0 -2px;padding:0 2px;border-radius:12px;transition:background .16s}
  .addrow:hover{background:#FCFBF8}
  /* B2 空分类位：与分类格同一块底，只是没有 emoji（2026-11-08 定案） */
  .addrow .slot{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:#F6F3EC;
                display:grid;place-items:center;color:rgba(29,28,26,.34)}
  .addrow .lbl{font-size:14px;font-weight:500;color:rgba(29,28,26,.62)}
  .addrow .rh{margin-left:auto;font-size:11px;color:#A8A39A}

  .toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,8px);background:rgba(29,28,26,.9);color:#fff;
         font-size:12px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:200;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">首页 v3 · 记一笔 = 记账行</div>
  <div class="grp">
    <span class="lbl">天数</span>
    <span class="chip on" data-n="1">1 张</span>
    <span class="chip" data-n="2">2</span>
    <span class="chip" data-n="4">4</span>
    <span class="chip" data-n="7">7（上限）</span>
    <label class="toggle"><input type="checkbox" id="emptyChk"> 首次使用（空账本）</label>
    <span class="readout" id="readout"></span>
  </div>
</div>

<div class="stage"><div class="device" id="dev"></div></div>

<script>
var ICO = {
  flow:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  wallet:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10.5h18M16 15h2"/></svg>',
  gear:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.6v2M12 18.4v2M3.6 12h2M18.4 12h2M6.1 6.1l1.4 1.4M16.5 16.5l1.4 1.4M17.9 6.1l-1.4 1.4M7.5 16.5l-1.4 1.4"/></svg>',
  plus:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>'
};

/* 7 天数据（今天在最前；实际只渲染前 N 天） */
var DAYS = [
  { m:11, d:6, w:'今天', today:true, rows:[
    { icon:'Croissant', t:'好利来', s:'吃 · 花呗', a:32.00, bg:'#FFF1E6' },
    { icon:'LightRail', t:'地铁', s:'行 · 建行5044', a:4.00, bg:'#EAF2FF' },
    { icon:'Cat', t:'麦富迪猫粮', s:'情 · 白条', a:129.00, bg:'#F3EEFF' },
    { icon:'HotBeverage', t:'星巴克', s:'吃 · 花呗', a:28.00, bg:'#FFF1E6' },
    { icon:'Taxi', t:'滴滴', s:'行 · 招行', a:19.50, bg:'#EAF2FF' },
    { icon:'BentoBox', t:'工作午餐', s:'吃 · 微信', a:26.00, bg:'#FFF1E6' },
    { icon:'ShoppingBags', t:'日用补货', s:'穿 · 余额宝', a:63.00, bg:'#FFF1E6' },
    { icon:'GameDie', t:'手游充值', s:'乐 · 花呗', a:30.00, bg:'#EAF2FF' }
  ]},
  { m:11, d:5, w:'周三', rows:[
    { icon:'HotBeverage', t:'星巴克', s:'吃 · 花呗', a:28.00, bg:'#FFF1E6' },
    { icon:'Taxi', t:'滴滴', s:'行 · 招行', a:19.50, bg:'#EAF2FF' }
  ]},
  { m:11, d:4, w:'周二', rows:[ { icon:'Cat', t:'麦富迪猫粮', s:'情 · 白条', a:129.00, bg:'#F3EEFF' } ]},
  { m:11, d:3, w:'周一', rows:[
    { icon:'Croissant', t:'好利来', s:'吃 · 花呗', a:26.00, bg:'#FFF1E6' },
    { icon:'LightRail', t:'地铁', s:'行 · 建行5044', a:4.00, bg:'#EAF2FF' }
  ]},
  { m:11, d:2, w:'周日', rows:[] },
  { m:11, d:1, w:'周六', rows:[
    { icon:'BentoBox', t:'朋友聚餐', s:'吃 · 微信', a:186.00, bg:'#FFF1E6' },
    { icon:'GameDie', t:'电影票', s:'乐 · 花呗', a:76.00, bg:'#EAF2FF' }
  ]},
  { m:10, d:31, w:'周五', rows:[ { icon:'Taxi', t:'打车回家', s:'行 · 滴滴', a:33.00, bg:'#EAF2FF' } ]}
];
var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var MAXCARDS = 7;

function money(n){ return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function pad2(n){ return String(n).padStart(2,'0'); }

function cardHTML(day, depth, isEmpty){
  var rows = (depth > 0) ? '' : (isEmpty || !day.rows.length)
    ? '<div class="empty">' + (isEmpty ? '还没有记账' : '没花钱的一天 :)') + '<small>' + (isEmpty ? '下面那一行就是入口' : '右滑可以看到昨天之前') + '</small></div>'
    : day.rows.map(function(r){
        return '<div class="tx"><div class="ic" style="background:' + r.bg + '">'
          + '<img src="../../assets/emoji/picked/' + r.icon + '.png" alt="">'
          + '</div><div><div class="tt">' + r.t + '</div><div class="ts">' + r.s + '</div></div>'
          + '<div class="ta">−¥' + money(r.a) + '</div></div>';
      }).join('');
  var sum = (depth > 0 || isEmpty || !day.rows.length) ? 0 : day.rows.reduce(function(a,r){ return a + r.a; }, 0);
  var head = '<div class="ch"><div class="dwrap"><span class="mon">' + MON[day.m-1] + '</span>'
    + '<span class="dnum">' + pad2(day.d) + '</span><span class="wday">' + day.w + '</span></div>'
    + (sum > 0 ? '<div class="totals"><span class="lbl">支出</span><span class="exp">−¥' + money(sum) + '</span></div>' : '')
    + '</div>';
  var note = day.today ? '<span class="note">本月 <s>↘ 12.4%</s></span>' : '';
  var addrow = '<div class="addrow" data-tap="1"><span class="slot">' + ICO.plus + '</span>'
    + '<span class="lbl">记一笔</span><span class="rh">' + (day.today ? '今天' : (day.m + '月' + day.d + '日')) + '</span></div>';
  return '<div class="card' + (depth === 0 ? ' front' : ' behind') + '">'
    + note + head + '<div class="hr"></div><div class="rows">' + rows + '</div>'
    + (depth === 0 ? addrow : '')
    + '</div>';
}

var dev = document.getElementById('dev');
var state = { n: 1, empty: false, idx: 0 };   /* idx = 当前前卡在 days 里的下标，初始为最后一张（今天） */

var ROT = [-1.0, 0.9, -1.3, 1.1, -0.8, 1.2, -1.0];
var OFFX = [-5, 4, -4, 5, -3, 4, -4];
var THICK = 10;   /* 层厚：恒定 10pt */
var BASE = 8;     /* 最下层卡距卡堆底 */

function render(){
  var n = state.n;
  var all = DAYS.slice(0, n).slice().reverse();    /* 老 → 新，最上面那张是今天 */
  /* S1 叠法：只画前卡和它下面最多 3 张，更深的卡不画（否则 7 张就是 6 条等距白边） */
  var from = Math.max(0, state.idx - 3);
  var days = all.slice(from, state.idx + 1);
  var cards = days.map(function(d, i){
    var depth = (i + from) - state.idx;   /* 0 = 前卡；<0 是后层 */
    return { depth: depth, html: cardHTML(d, Math.max(0, -depth), state.empty) };
  });

  var inner = '<div class="statusbar"><span>9:41</span><span><i></i></span></div>'
    + '<div class="hd"><span class="logo">DooDoo</span>'
    +   '<span class="tabx"><span class="t on">' + ICO.flow + '</span><span class="t">' + ICO.wallet + '</span><span class="t">' + ICO.gear + '</span></span>'
    + '</div>'
    + '<div class="deck" id="deck">' + cards.map(function(c){ return c.html; }).join('') + '</div>'
    + '<div class="toast" id="toast"></div>';

  dev.innerHTML = '<div class="screen">' + inner + '</div>';

  /* 深度几何：层厚恒定 10，可见层封顶 4 张（3 条边）；前卡不低于 34（Home 指示条之上） */
  var visible = Math.min(n - 1, 3);
  var band = THICK * visible;
  var frontScreen = Math.max(34, 8 + band);
  var els = Array.prototype.slice.call(dev.querySelectorAll('.deck > .card'));
  els.forEach(function(el, i){
    var depth = (i + from) - state.idx;
    var xf, bottom, z;
    if (depth <= 0){
      var d = -depth;
      bottom = frontScreen - THICK * d - 8;   /* 转成 deck 内坐标（deck 底距屏幕 8） */
      xf = 'translateX(' + (d === 0 ? 0 : OFFX[d % OFFX.length]) + 'px) rotate(' + (d === 0 ? 0 : ROT[d % ROT.length]) + 'deg)';
      z = n - d;
      el.classList.toggle('front', d === 0);
      el.classList.toggle('behind', d !== 0);
    } else {
      bottom = frontScreen - 8;
      xf = 'translateX(430px)';
      z = 1;
    }
    el.style.bottom = bottom + 'px';
    el.style.transform = xf;
    el.style.zIndex = z;
    el.style.transition = 'transform .36s cubic-bezier(.32,.72,0,1),bottom .36s cubic-bezier(.32,.72,0,1)';
  });

  document.getElementById('readout').textContent =
    '共 ' + n + ' 天 · 画出 ' + days.length + ' 张（可见层封顶 4） · 层厚带 ' + band + ' · 前卡底距屏 ' + frontScreen + ' · 卡高 ' + (720 - (frontScreen - 8));
}
render();

/* 控件 */
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click', function(){
    state.n = +c.dataset.n;
    state.idx = state.n - 1;   /* 切天数后回到今天 */
    document.querySelectorAll('.chip').forEach(function(x){ x.classList.toggle('on', x === c); });
    render();
  });
});
document.getElementById('emptyChk').addEventListener('change', function(e){
  state.empty = e.target.checked;
  render();
});

/* 翻卡：左滑看更早，右滑回今天 */
var deck = null, sx = 0, sy = 0, down = false, axis = null, dx = 0;
dev.addEventListener('pointerdown', function(e){
  down = true; sx = e.clientX; sy = e.clientY; axis = null; dx = 0;
});
window.addEventListener('pointermove', function(e){
  if (!down) return;
  var d = e.clientX - sx, dy = e.clientY - sy;
  if (!axis && (Math.abs(d) > 8 || Math.abs(dy) > 8)) axis = Math.abs(d) > Math.abs(dy) ? 'x' : 'y';
  if (axis !== 'x') return;
  dx = d;
  var front = dev.querySelector('.deck > .card.front');
  if (front) front.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 110) + 'deg)';
});
window.addEventListener('pointerup', function(){
  if (!down) return; down = false;
  if (axis === 'x' && Math.abs(dx) > 90){
    if (dx < 0 && state.idx > 0) state.idx--;               /* 左滑：看更早（数组是老→新，向小下标走） */
    else if (dx > 0 && state.idx < state.n - 1) state.idx++;   /* 右滑：回到更近 */
  }
  dx = 0;
  render();
});

/* 记账行：仅提示，原型不展开录入页 */
dev.addEventListener('click', function(e){
  if (!e.target.closest('[data-tap="1"]')) return;
  var t = document.getElementById('toast');
  t.textContent = '→ 进记账页（见 entry-bcd.html 第四格）';
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('on'); }, 1600);
});

function fit(){
  var s = Math.min((window.innerWidth - 40) / 390, (window.innerHeight - 54 - 30) / 844, 1);
  dev.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();
</script>
</body>
</html>
