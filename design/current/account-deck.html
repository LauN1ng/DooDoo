<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>账户卡形态对比 · 平铺 / 卡牌堆 / 满宽叠层</title>
<style>
  :root{
    --ink:#1D1C1A; --ink2:#6B6862; --ink3:#9A968D; --ink4:#B0ACA3;
    --bg:#F7F5F1; --card:#fff; --line:#EAE7E0;
    --red:#C0392B; --green:#2E9E6B; --blue:#4C8DF6;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;height:100%}
  body{
    background:#EFECE7;
    font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;
  }
  .bar{
    width:100%;height:56px;flex:0 0 56px;display:flex;align-items:center;gap:16px;
    padding:0 20px;border-bottom:1px solid #E2DFD9;background:#F4F1EC;position:relative;z-index:10;
    overflow:hidden;
  }
  .brand{font-size:13px;font-weight:650;letter-spacing:.01em}
  .chips{display:flex;gap:6px;flex:0 0 auto}
  .chip{
    border:1px solid #DEDAD2;background:#FBFAF7;color:#4A4741;
    font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;
    transition:.16s;
  }
  .chip.on{background:#1D1C1A;color:#fff;border-color:#1D1C1A}
  .hint{margin-left:auto;font-size:11.5px;color:#8A867D;text-align:right;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}

  .stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:20px}
  .device{width:390px;height:844px;transform-origin:top center;position:relative}
  .screen{
    position:absolute;inset:0;overflow:hidden;border-radius:44px;background:var(--bg);
    box-shadow:0 0 0 1px #DAD6CE,0 30px 70px rgba(0,0,0,.16);
  }

  /* ---- 手机内 ---- */
  .statusbar{
    height:52px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 8px;font-size:13px;font-weight:600;letter-spacing:.01em;
  }
  .statusbar .batt{width:22px;height:11px;border-radius:3px;border:1px solid rgba(29,28,26,.35);position:relative}
  .statusbar .batt::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:70%;background:var(--ink);border-radius:1.5px}

  .scroll{position:absolute;left:0;right:0;top:52px;bottom:0;overflow-y:auto;padding:0 16px 110px}
  .scroll::-webkit-scrollbar{display:none}

  .pagetop{display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px 14px}
  .pagetop .lg{font-size:19px;font-weight:650;letter-spacing:-.02em}
  .pagetop .seg{display:flex;background:#EBE7E0;border-radius:999px;padding:2px}
  .pagetop .seg span{font-size:11.5px;padding:5px 11px;border-radius:999px;color:#7A766E}
  .pagetop .seg span.on{background:#fff;color:var(--ink);font-weight:600}

  /* 汇总卡 */
  .sum{
    background:var(--card);border-radius:24px;padding:16px 16px 10px;
    box-shadow:0 1px 2px rgba(29,28,26,.03),0 8px 22px rgba(29,28,26,.05);
    margin-bottom:14px;
  }
  .sumtop{display:flex;gap:14px}
  .sumcol{flex:1;min-width:0}
  .sumcol .k{font-size:10px;color:var(--ink3);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
  .sumcol .k .dot{width:6px;height:6px;border-radius:50%}
  .sumcol .v{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
  .sumcol .p{font-size:11px;margin-top:3px}
  .up{color:var(--red)}
  .down{color:var(--green)}
  .chart{padding:12px 0 2px}
  .ranges{display:flex;gap:4px;padding:2px 0 4px}
  .rg{
    flex:1;border:0;background:transparent;font:inherit;font-size:10.5px;color:var(--ink3);
    padding:5px 0;border-radius:999px;cursor:pointer;
  }
  .rg.on{background:#F3F0EA;color:var(--ink);font-weight:600}

  /* 分组 */
  .grp{margin-bottom:18px}
  .grph{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
  .grph .l{display:flex;align-items:baseline;gap:7px}
  .grph .nm{font-size:14px;font-weight:650}
  .grph .tt{font-size:12px;color:#8A867D;font-weight:400}
  .grph .add{font-size:13px;color:var(--ink4)}

  .duebar{
    display:flex;align-items:baseline;justify-content:space-between;
    background:#fff;border-radius:12px;padding:11px 13px;margin-bottom:8px;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .duebar .dl{font-size:10.5px;color:var(--ink3);margin-right:7px}
  .duebar .dv{font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .duebar .dn{font-size:10.5px;color:var(--ink3)}
  .odstrip{
    background:#FDECEC;color:#A32D2D;border-radius:12px;padding:9px 12px;
    font-size:11px;line-height:1.5;margin-bottom:8px;
  }
  .odstrip b{font-weight:650}

  /* 账户行（平铺） */
  .acc{display:flex;align-items:center;gap:12px;padding:8px 0}
  .bc{
    width:148px;height:92px;flex:0 0 148px;border-radius:14px;padding:10px 11px;
    display:flex;flex-direction:column;justify-content:space-between;color:#fff;
    position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    box-shadow:0 4px 12px rgba(29,28,26,.14);
  }
  .bctop{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;position:relative}
  .bn{font-size:11.5px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
  .bm{font-size:9px;opacity:.78;margin-top:3px;letter-spacing:.02em}
  .bcbot{display:flex;align-items:center;gap:6px;position:relative}
  .bn2{font-size:9.5px;letter-spacing:.09em;opacity:.92;font-variant-numeric:tabular-nums}
  .bnet{margin-left:auto;font-size:7.5px;font-weight:700;letter-spacing:.09em;opacity:.7;text-transform:uppercase}
  .rpg{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.20);z-index:2}
  .rpg i{display:block;height:100%;width:var(--u);background:rgba(255,255,255,.90)}
  .flag{
    position:absolute;top:0;right:0;background:rgba(255,255,255,.94);color:#A32D2D;
    font-size:8.5px;font-weight:700;letter-spacing:.03em;padding:3px 8px;
    border-bottom-left-radius:9px;z-index:2;
  }
  .cols{flex:1;display:flex;gap:6px;min-width:0}
  .col{flex:1;min-width:0}
  .col .k{font-size:10px;color:var(--ink3)}
  .col .v{font-size:15px;font-weight:600;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .col .v.sm{font-size:12.5px;line-height:1.35;font-weight:600}
  .col .v.red{color:var(--red)}
  .col .v.dim{color:#B0ACA3}
  .col .v.green{color:var(--green)}
  .col .d{font-size:10px;margin-top:3px;color:var(--ink3)}
  .more{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 6px 4px;font-size:12.5px;color:#8A867D;
  }
  .more .arw{font-size:13px;color:var(--ink4)}

  /* ---- 变体二：卡牌堆 ---- */
  .pilebox{
    display:flex;align-items:center;gap:16px;
    background:#fff;border-radius:18px;padding:16px 14px 16px 18px;
    box-shadow:0 1px 2px rgba(29,28,26,.03),0 6px 18px rgba(29,28,26,.05);
  }
  .pile{position:relative;width:108px;height:78px;flex:0 0 108px}
  .pc{
    position:absolute;left:0;top:0;width:92px;height:62px;border-radius:11px;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    box-shadow:0 1px 0 rgba(29,28,26,.18),0 3px 7px rgba(29,28,26,.16),inset 0 0 0 .5px rgba(255,255,255,.24);
  }
  .pc.l1{left:8px;top:8px;transform:rotate(2deg)}
  .pc.l2{left:16px;top:16px;transform:rotate(-1.4deg)}
  .pc.l0{z-index:3;display:flex;flex-direction:column;justify-content:space-between;padding:9px 10px}
  .pc .pn{font-size:10.5px;font-weight:650;color:#fff;line-height:1.2}
  .pc .pb{font-size:8px;color:rgba(255,255,255,.82);letter-spacing:.08em}
  .pcnt{
    position:absolute;right:0;bottom:0;z-index:4;background:#1D1C1A;color:#fff;
    font-size:9px;font-weight:650;border-radius:999px;padding:2px 6px;
    box-shadow:0 0 0 2px #fff;
  }
  .pileright{flex:1;min-width:0}
  .pileright .k{font-size:10px;color:var(--ink3)}
  .pileright .v{font-size:18px;font-weight:650;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
  .pileright .d{font-size:10.5px;color:var(--ink3);margin-top:5px}
  .pileright .d b{color:var(--ink);font-weight:600}

  /* ---- 变体三：满宽叠层 ---- */
  .deck{position:relative;height:112px;margin-bottom:2px}
  .dc{
    position:absolute;left:0;right:0;height:96px;border-radius:16px;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    box-shadow:0 2px 6px rgba(29,28,26,.14),inset 0 0 0 .5px rgba(255,255,255,.20);
  }
  .dc.l2{left:12px;right:12px;top:16px;transform:rotate(-1.4deg)}
  .dc.l1{left:6px;right:6px;top:8px;transform:rotate(1.0deg)}
  .dc.l0{top:0;z-index:3;padding:13px 14px;display:flex;flex-direction:column;justify-content:space-between}
  .dc .dnm{font-size:14px;font-weight:650;color:#fff}
  .dc .dsub{font-size:9.5px;color:rgba(255,255,255,.8);margin-top:3px}
  .dc .dnum{font-size:19px;font-weight:650;color:#fff;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .dc .ddots{position:absolute;right:13px;bottom:12px;display:flex;gap:3px;z-index:4}
  .dc .ddots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.5)}
  .dc .ddots i.on{background:#fff;width:10px;border-radius:2px}
  .dmeta{display:flex;gap:8px;margin-top:10px}
  .dmeta .m{flex:1;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .dmeta .m .k{font-size:10px;color:var(--ink3)}
  .dmeta .m .v{font-size:15px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
  .dnav{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding:0 2px;font-size:11px;color:var(--ink3)}

  /* ---- 变体四：混合（在用平铺 + 归零卡牌堆） ---- */
  .settled{
    display:flex;align-items:center;gap:14px;
    background:#FBFAF7;border-radius:16px;padding:11px 14px;
    box-shadow:inset 0 0 0 1px #EDE9E1;
  }
  .settled .pile{width:84px;height:58px;flex:0 0 84px}
  .settled .pc{width:70px;height:48px;border-radius:9px}
  .settled .pc.l1{left:7px;top:6px;transform:rotate(1.8deg)}
  .settled .pc.l2{left:14px;top:12px;transform:rotate(-1.2deg)}
  .settled .pc.l0{padding:7px 8px}
  .settled .pc .pn{font-size:9px}
  .settled .pc .pb{font-size:6.5px}
  .settled .pcnt{font-size:8.5px;padding:1px 5px;box-shadow:0 0 0 2px #FBFAF7}
  .settled .sr{flex:1;min-width:0}
  .settled .sr .k{font-size:11.5px;color:#6B6862;font-weight:600}
  .settled .sr .d{font-size:10px;color:var(--ink4);margin-top:3px}
  .settled .arw{font-size:14px;color:var(--ink4)}
  .settled.stackC{background:#F7F5F1}

  .note{display:none}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">账户卡形态 · 三版对比</div>
  <div class="chips" id="chips">
    <button class="chip on" data-v="mixed">混合（推荐）</button>
    <button class="chip" data-v="flat">平铺（全量）</button>
    <button class="chip" data-v="pile">卡牌堆</button>
    <button class="chip" data-v="deck">满宽叠层</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div class="stage"><div class="device" id="dev"><div class="screen"></div></div></div>

<script>
var CREDIT = [
  { n:'招商银行', m:'信用卡', num:'•••• 8857', net:'UnionPay', c1:'#D4342B', c2:'#8C1410', debt:'−3,120.00', delta:'较上月 ↓1,240', dcls:'down', due:'665.36<br>11/08', u:'0%', flag:'逾期' },
  { n:'花呗', m:'循环 + 分期 58 笔', num:'支付宝', net:'Alipay', c1:'#2C7BFF', c2:'#0B4FCC', debt:'−7,842.50', delta:'较上月 ↑320', dcls:'up', due:'1,634.08<br>11/25', u:'67%' },
  { n:'招商银行', m:'e招贷 · 17/24 期', num:'•••• 6612', net:'CMB', c1:'#3C3C43', c2:'#131316', debt:'−6,670.93', delta:'较上月 ↓442.50', dcls:'down', due:'442.50<br>11/10', u:'100%' },
  { n:'京东金融', m:'白条', num:'•••• 3078', net:'JD Pay', c1:'#E4393C', c2:'#9E1B1E', debt:'−613.16', delta:'较上月 ↓88', dcls:'down', due:'613.16<br>12/02', u:'33%' }
];
var SAVING = [
  { n:'建设银行', m:'储蓄卡 · 主支付', num:'•••• 5044', net:'UnionPay', c1:'#1E6FBF', c2:'#0B3F78', bal:'1,204.30', delta:'↘ 6.2%', dcls:'down' },
  { n:'余额宝', m:'货币基金', num:'支付宝', net:'Alipay', c1:'#12A08F', c2:'#06645A', bal:'1,915.70', delta:'↗ 1.8%', dcls:'up' }
];

/* 已结清 / 归零账户：真实存在但不需要逐个看 */
var GRAY = { c1:'#CFCAC1', c2:'#ABA69C' };
var ARCHIVED_C = [
  { n:'中信银行', m:'信用卡 · 已结清', num:'•••• 2049', net:'UnionPay', c1:GRAY.c1, c2:GRAY.c2, debt:'0.00', delta:'已结清', dcls:'', due:'—', u:'100%', settled:1 },
  { n:'借呗', m:'已结清', num:'支付宝', net:'Alipay', c1:GRAY.c1, c2:GRAY.c2, debt:'0.00', delta:'已结清', dcls:'', due:'—', u:'100%', settled:1 },
  { n:'微粒贷', m:'已结清', num:'微信支付', net:'WeChat', c1:GRAY.c1, c2:GRAY.c2, debt:'0.00', delta:'已结清', dcls:'', due:'—', u:'100%', settled:1 },
  { n:'招商银行', m:'分期 · 已结清', num:'•••• 3311', net:'CMB', c1:GRAY.c1, c2:GRAY.c2, debt:'0.00', delta:'已结清', dcls:'', due:'—', u:'100%', settled:1 },
  { n:'父母借款', m:'已还清', num:'无卡号', net:'', c1:GRAY.c1, c2:GRAY.c2, debt:'0.00', delta:'已还清', dcls:'', due:'—', u:'100%', settled:1 }
];
var EMPTY_S = [
  { n:'工商银行', m:'储蓄卡', num:'•••• 6217', net:'UnionPay', c1:GRAY.c1, c2:GRAY.c2, bal:'0.00', delta:'—', dcls:'', settled:1 },
  { n:'中国银行', m:'储蓄卡', num:'•••• 3302', net:'UnionPay', c1:GRAY.c1, c2:GRAY.c2, bal:'0.00', delta:'—', dcls:'', settled:1 },
  { n:'农业银行', m:'储蓄卡', num:'•••• 8891', net:'UnionPay', c1:GRAY.c1, c2:GRAY.c2, bal:'0.00', delta:'—', dcls:'', settled:1 },
  { n:'交通银行', m:'储蓄卡', num:'•••• 4477', net:'UnionPay', c1:GRAY.c1, c2:GRAY.c2, bal:'0.00', delta:'—', dcls:'', settled:1 },
  { n:'招商银行', m:'储蓄卡', num:'•••• 1102', net:'CMB', c1:GRAY.c1, c2:GRAY.c2, bal:'0.00', delta:'—', dcls:'', settled:1 },
  { n:'微信零钱', m:'零钱', num:'微信支付', net:'WeChat', c1:GRAY.c1, c2:GRAY.c2, bal:'0.00', delta:'—', dcls:'', settled:1 }
];

function accHTML(a, isCredit){
  return '<div class="acc">'
    + '<div class="bc" style="--c1:' + a.c1 + ';--c2:' + a.c2 + '">'
    +   (isCredit ? '<div class="rpg" style="--u:' + a.u + '"><i></i></div>' : '')
    +   (a.flag ? '<div class="flag">' + a.flag + '</div>' : '')
    +   '<div class="bctop"><div><div class="bn">' + a.n + '</div><div class="bm">' + a.m + '</div></div></div>'
    +   '<div class="bcbot"><span class="bn2">' + a.num + '</span><span class="bnet">' + a.net + '</span></div>'
    + '</div>'
    + '<div class="cols">'
    +   '<div class="col"><div class="k">' + (isCredit ? '欠款' : '余额') + '</div>'
    +     '<div class="v ' + (a.settled ? 'dim' : (isCredit ? 'red' : '')) + '">' + (isCredit ? a.debt : a.bal) + '</div>'
    +     '<div class="d ' + (a.dcls || '') + '">' + a.delta + '</div></div>'
    +   '<div class="col"><div class="k">' + (isCredit ? '本期应还' : '较上月') + '</div>'
    +     '<div class="v sm">' + (isCredit ? a.due : '') + '</div></div>'
    + '</div></div>';
}

function creditFlat(){ return CREDIT.concat(ARCHIVED_C).map(function(a){ return accHTML(a, true); }).join(''); }
function savingFlat(){ return SAVING.concat(EMPTY_S).map(function(a){ return accHTML(a, false); }).join(''); }

function creditPile(){
  return '<div class="pilebox" data-open="0">'
    + '<div class="pile">'
    +   '<div class="pc l2" style="--c1:#3C3C43;--c2:#131316"></div>'
    +   '<div class="pc l1" style="--c1:#2C7BFF;--c2:#0B4FCC"></div>'
    +   '<div class="pc l0" style="--c1:#D4342B;--c2:#8C1410"><div class="pn">招商银行</div><div class="pb">•••• 8857</div></div>'
    +   '<div class="pcnt">9</div>'
    + '</div>'
    + '<div class="pileright">'
    +   '<div class="k">欠款合计</div>'
    +   '<div class="v" style="color:#C0392B">−28,466.00</div>'
    +   '<div class="d">本月要还 <b>2,742.00</b> · 3 笔 · 最近 11/08</div>'
    + '</div></div>'
    + '<div class="more"><span>含逾期 1 个 · 已结清 4 个</span><span class="arw">›</span></div>';
}
function savingPile(){
  return '<div class="pilebox">'
    + '<div class="pile">'
    +   '<div class="pc l2" style="--c1:#12A08F;--c2:#06645A"></div>'
    +   '<div class="pc l1" style="--c1:#1E6FBF;--c2:#0B3F78"></div>'
    +   '<div class="pc l0" style="--c1:#1E6FBF;--c2:#0B3F78"><div class="pn">建设银行</div><div class="pb">•••• 5044</div></div>'
    +   '<div class="pcnt">8</div>'
    + '</div>'
    + '<div class="pileright">'
    +   '<div class="k">余额合计</div>'
    +   '<div class="v">3,120.00</div>'
    +   '<div class="d">较上月 <b class="down">↘ 4.8%</b> · 2 个在用</div>'
    + '</div></div>';
}

function creditDeck(){
  var a = CREDIT[0];
  return '<div class="deck">'
    + '<div class="dc l2" style="--c1:#3C3C43;--c2:#131316"></div>'
    + '<div class="dc l1" style="--c1:#2C7BFF;--c2:#0B4FCC"></div>'
    + '<div class="dc l0" style="--c1:' + a.c1 + ';--c2:' + a.c2 + '">'
    +   '<div><div class="dnm">' + a.n + ' ' + a.num + '</div><div class="dsub">信用卡 · 本期应还 ' + a.due.split('<br>')[0] + ' · ' + a.due.split('<br>')[1] + '</div></div>'
    +   '<div class="dnum">' + a.debt + '</div>'
    +   '<div class="ddots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'
    + '</div></div>'
    + '<div class="dmeta">'
    +   '<div class="m"><div class="k">较上月</div><div class="v down">↓1,240</div></div>'
    +   '<div class="m"><div class="k">还款进度</div><div class="v">0%</div></div>'
    + '</div>'
    + '<div class="dnav"><span>1 / 9</span><span>左右滑动切换账户 ›</span></div>';
}

function settledPile(o){
  return '<div class="settled">'
    + '<div class="pile">'
    +   '<div class="pc l2" style="--c1:#E3DFD7;--c2:#C7C2B8"></div>'
    +   '<div class="pc l1" style="--c1:#DBD7CF;--c2:#BCB7AD"></div>'
    +   '<div class="pc l0" style="--c1:#D2CEC5;--c2:#AEA99F"><div class="pn">已结清</div><div class="pb">ARCHIVED</div></div>'
    +   '<div class="pcnt">' + o.count + '</div>'
    + '</div>'
    + '<div class="sr"><div class="k">' + o.title + '</div><div class="d">' + o.sub + '</div></div>'
    + '<span class="arw">›</span>'
    + '</div>';
}

function creditMixed(){
  return CREDIT.map(function(a){ return accHTML(a, true); }).join('')
    + settledPile({ count:'5', title:'已结清 5 个 · 0.00', sub:'点开恢复平铺' });
}
function savingMixed(){
  return SAVING.map(function(a){ return accHTML(a, false); }).join('')
    + settledPile({ count:'6', title:'余额 0.00 · 6 个', sub:'点开恢复平铺' });
}

function screenHTML(v){
  var creditBody = v === 'flat' ? creditFlat()
    : (v === 'deck' ? creditDeck()
    : (v === 'mixed' ? creditMixed() : creditPile()));
  var savingBody = v === 'flat' ? savingFlat()
    : (v === 'deck' ? '<div class="dnav" style="margin-top:6px"><span>叠层同上，共 8 张</span><span></span></div>'
    : (v === 'mixed' ? savingMixed() : savingPile()));
  return ''
    + '<div class="statusbar"><span>9:41</span><span class="batt"></span></div>'
    + '<div class="scroll">'
    +   '<div class="pagetop"><span class="lg">DooDoo</span>'
    +     '<span class="seg"><span>流水</span><span class="on">资产</span></span></div>'
    +   '<div class="sum">'
    +     '<div class="sumtop">'
    +       '<div class="sumcol"><div class="k"><span class="dot" style="background:#3A9E6B"></span>我有</div>'
    +         '<div class="v">3,120.00</div><div class="p down">↘ 2.3%</div></div>'
    +       '<div class="sumcol"><div class="k"><span class="dot" style="background:#E8734A"></span>我欠</div>'
    +         '<div class="v">28,466.00</div><div class="p up">↗ 4.1%</div></div>'
    +     '</div>'
    +     '<div class="chart"><svg viewBox="0 0 320 60" width="100%" height="60" preserveAspectRatio="none">'
    +       '<polyline points="2,44 40,44 80,43 120,39 160,40 200,36 240,33 280,30 316,28" fill="none" stroke="#4C8DF6" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'
    +       '<polyline points="2,16 40,18 80,17 120,21 160,20 200,24 240,23 280,26 316,25" fill="none" stroke="#E8734A" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'
    +     '</svg></div>'
    +     '<div class="ranges"><button class="rg">1周</button><button class="rg">1月</button><button class="rg">3月</button><button class="rg">今年</button><button class="rg on">1年</button></div>'
    +   '</div>'
    +   '<div class="grp"><div class="grph"><div class="l"><span class="nm">信用</span><span class="tt">9 个 · 28,466.00</span></div><span class="add">＋</span></div>'
    +     '<div class="duebar"><div><span class="dl">本月要还</span><span class="dv">2,742.00</span></div><div class="dn">3 笔 · 最近 11/08</div></div>'
    +     '<div class="odstrip"><b>招行 8857 逾期 92 天</b>：8 月账单 665.36 未还</div>'
    +     creditBody
    +   '</div>'
    +   '<div class="grp"><div class="grph"><div class="l"><span class="nm">储蓄</span><span class="tt">8 个 · 3,120.00</span></div><span class="add">＋</span></div>'
    +     savingBody
    +   '</div>'
    + '</div>';
}

var VARIANTS = {
  mixed:{ name:'混合（推荐）', note:'在用账户平铺保留明细，归零/结清账户压成一摞；全量 17 个账户从 2236pt 降到约 1290pt，省 42%' },
  flat:{ name:'平铺（全量 17 个）', note:'现状做法全部展开：每张账户一行（卡面 148×92 + 两列），其中 11 个是已结清/余额 0' },
  pile:{ name:'卡牌堆', note:'每组叠成一摞（3 层、错位 8~16pt、旋转 ±2°），右侧只留合计；一屏装下但明细全丢' },
  deck:{ name:'满宽叠层', note:'把首页日卡的玩法搬到账户：一次只看一张，17 个账户要翻 17 次，失去横向比较' }
};

var dev = document.getElementById('dev');
var screenEl = dev.querySelector('.screen');
var hintEl = document.getElementById('hint');
var cur = 'flat';

function render(v){
  cur = v;
  screenEl.innerHTML = screenHTML(v);
  var m = VARIANTS[v];
  hintEl.textContent = m.name + ' · ' + m.note;
}
document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  [].slice.call(this.children).forEach(function(c){ c.classList.toggle('on', c === b); });
  render(b.dataset.v);
});

function fit(){
  var s = Math.min((window.innerWidth - 40) / 390, (window.innerHeight - 56 - 40) / 844, 1);
  dev.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();
render('mixed');
</script>
</body>
</html>
