<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DooDoo · tab 材质五版</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#EDEAE4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1D1C1A;display:flex;flex-direction:column;align-items:center}

  .bar{width:100%;height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #E2DFD9;background:#F4F1EC;overflow:hidden;z-index:5}
  .brand{font-size:13px;font-weight:650;white-space:nowrap}
  .chips{display:flex;gap:6px}
  .chip{border:1px solid #D8D4CB;background:#fff;border-radius:999px;padding:4px 11px;font-size:11.5px;color:#5F5E5A;cursor:pointer;font-family:inherit;white-space:nowrap}
  .chip.on{background:#1D1C1A;border-color:#1D1C1A;color:#fff}
  .hint{margin-left:auto;font-size:11.5px;color:#8A867D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}

  .stage{flex:1;min-width:0;min-height:0;width:100%;position:relative;overflow:hidden}
  .device{position:absolute;left:50%;top:16px;margin-left:-195px;width:390px;height:844px;transform-origin:top center}
  .screen{position:absolute;inset:0;overflow:hidden;border-radius:44px;background:#F7F5F1;box-shadow:0 0 0 1px #DAD6CE,0 30px 70px rgba(0,0,0,.16)}
  .statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;z-index:90}
  .statusbar i{display:block;width:15px;height:9px;border:.8px solid #1D1C1A;border-radius:2px;position:relative}
  .statusbar i::after{content:"";position:absolute;inset:1.5px;background:#1D1C1A;border-radius:1px}

  .hd{position:absolute;top:52px;left:20px;right:20px;height:34px;display:flex;align-items:center;justify-content:space-between;z-index:50}
  .hd .logo{font-size:21px;font-weight:700;letter-spacing:-.02em}
  .hd .htabs{display:none;align-items:center;gap:18px}
  .hd .htabs i{width:18px;height:18px;display:grid;place-items:center;color:#B0ACA3;position:relative;font-style:normal}
  .hd .htabs i svg{width:18px;height:18px}
  .hd .htabs i.on{color:#1D1C1A}
  .hd .htabs i.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;width:4px;height:4px;border-radius:50%;background:#1D1C1A}

  .deck{position:absolute;top:100px;left:0;right:0;bottom:8px;touch-action:pan-y}
  .card{position:absolute;left:16px;right:16px;top:0;background:#fff;border-radius:24px;
        padding:20px 18px 76px;display:flex;flex-direction:column;transform-origin:bottom center}
  .lay0{left:16px;right:16px;bottom:38px;z-index:40;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px rgba(0,0,0,.045)}
  .lay1{left:26px;right:26px;bottom:28px;z-index:30;box-shadow:0 1px 0 rgba(29,28,26,.10),0 4px 8px rgba(29,28,26,.05),inset 0 0 0 1px rgba(29,28,26,.11)}
  .lay2{left:25px;right:25px;bottom:18px;z-index:20;box-shadow:0 1px 0 rgba(29,28,26,.10),0 4px 8px rgba(29,28,26,.05),inset 0 0 0 1px rgba(29,28,26,.11)}
  .lay3{left:28px;right:28px;bottom:8px;z-index:10;box-shadow:0 1px 0 rgba(29,28,26,.10),0 6px 16px rgba(29,28,26,.10),inset 0 0 0 1px rgba(29,28,26,.11)}
  .lay1>*,.lay2>*,.lay3>*{opacity:0}
  .layX{opacity:0;pointer-events:none;z-index:5}

  .note{position:absolute;right:6px;top:-14px;transform:rotate(-3deg);
        background:#FFF7E0;border:1px solid #EFE2BE;border-radius:5px;padding:5px 10px;
        font-size:11px;color:#8A6D2F;box-shadow:0 3px 8px rgba(0,0,0,.09);z-index:6;white-space:nowrap}
  .note s{text-decoration:none;color:#3B7A44}

  .ch{display:flex;justify-content:space-between;align-items:flex-start}
  .dwrap{display:flex;align-items:baseline;gap:6px}
  .mon{font-size:11px;color:#A8A39A;letter-spacing:.08em}
  .dnum{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .wday{font-size:12px;color:#A8A39A}
  .totals{display:flex;align-items:baseline;gap:6px}
  .totals .lbl{font-size:11px;color:#A8A39A}
  .totals .exp{font-size:16px;font-weight:600;color:#C0392B;font-variant-numeric:tabular-nums}
  .hr{height:1px;background:#EFECE5;margin:14px 0 2px}
  .rows{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px;min-height:0;scrollbar-width:none;
        -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent 100%);
        mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent 100%)}
  .rows::-webkit-scrollbar{width:0;height:0}
  .tx{display:flex;align-items:center;gap:12px;padding:11px 0}
  .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 42px}
  .ic img{width:27px;height:27px;display:block}
  .tt{font-size:14px;font-weight:500}
  .ts{font-size:11.5px;color:#A8A39A;margin-top:2px}
  .ta{margin-left:auto;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#B5B1A8;font-size:14px}
  .empty small{font-size:11.5px;color:#C6C2B9}

  .fab{position:absolute;right:18px;bottom:47px;width:46px;height:46px;border-radius:23px;z-index:60;
       background:#1D1C1A;color:#fff;display:grid;place-items:center;
       box-shadow:0 8px 18px rgba(29,28,26,.22)}

  /* ===== A：无容器 · 墨点选中 ===== */
  /* 裸图标直接压在层叠边缘上会和纸边混读 → 每个图标加一枚 34pt 极浅底托
     （不是胶囊，是方形浅底，和 emoji 的 42px 浅底圆角容器同一套语言） */
  .navA{position:absolute;left:18px;bottom:48px;z-index:60;display:none;align-items:center;gap:6px}
  .navA i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
         background:rgba(252,250,246,.86);color:#A8A39A;position:relative;font-style:normal;
         box-shadow:0 0 0 1px rgba(29,28,26,.07)}
  .navA i.on{color:#1D1C1A;background:#fff;
         box-shadow:0 0 0 1px rgba(29,28,26,.13),0 3px 8px rgba(29,28,26,.08)}
  .navA i.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-4px;width:12px;height:1.5px;border-radius:1px;background:#1D1C1A}

  /* ===== B：三张独立纸签，选中那张抬起 ===== */
  /* 白签浮白卡行不通（记忆里的老教训），所以纸签用「描边 + 硬影」分层，
     并且把选中态从「抬起」改成「填墨」——抬起靠阴影，白底上读不出来 */
  .navB{position:absolute;left:16px;bottom:48px;z-index:60;display:none;align-items:center;gap:7px}
  .navB i{width:40px;height:36px;border-radius:11px;display:grid;place-items:center;
         background:#FCFBF8;color:#A8A39A;font-style:normal;
         box-shadow:0 0 0 1px rgba(29,28,26,.13),0 2px 4px rgba(29,28,26,.06)}
  .navB i.on{color:#fff;background:#1D1C1A;
         box-shadow:0 0 0 1px rgba(29,28,26,.13),0 4px 10px rgba(29,28,26,.20)}

  /* ===== C：玻璃胶囊 ===== */
  /* 纯玻璃浮白卡读不出边界 → 加深底色 + 更强描边，靠明度差读出容器 */
  .navC{position:absolute;left:16px;bottom:50px;height:40px;z-index:60;display:none;align-items:center;gap:2px;padding:0 6px;
        border-radius:20px;background:rgba(246,243,238,.92);
        -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
        box-shadow:0 8px 24px rgba(29,28,26,.13),inset 0 0 0 1px rgba(29,28,26,.13)}
  .navC i{width:34px;height:32px;border-radius:16px;display:grid;place-items:center;color:#A8A39A;font-style:normal}
  .navC i.on{color:#1D1C1A;background:rgba(29,28,26,.07)}

  /* ===== D：墨键（现状基线） ===== */
  .navD{position:absolute;left:16px;bottom:52px;height:36px;z-index:60;display:none;align-items:center;gap:1px;padding:0 6px;
        border-radius:18px;background:#1D1C1A;box-shadow:0 10px 22px rgba(29,28,26,.22)}
  .navD i{width:36px;height:30px;display:grid;place-items:center;border-radius:15px;color:rgba(255,255,255,.5);font-style:normal}
  .navD i.on{color:#fff;background:rgba(255,255,255,.13)}

  /* ===== E：顶栏（无底部 tab） ===== */
  .vE .hd .htabs{display:flex}
  .vE .fab{bottom:34px}
  /* 页头有 tab 时，便签下移让开（否则和页头图标挤在一起） */
  .vE .note{top:6px}

  .vA .navA,.vB .navB,.vC .navC,.vD .navD{display:flex}
  .vA .navB,.vA .navC,.vA .navD,
  .vB .navA,.vB .navC,.vB .navD,
  .vC .navA,.vC .navB,.vC .navD,
  .vD .navA,.vD .navB,.vD .navC{display:none}
</style>
</head>
<body class="vA">
<div class="bar">
  <div class="brand">tab 材质 · 五版</div>
  <div class="chips" id="chips">
    <button class="chip on" data-v="A">A 无容器</button>
    <button class="chip" data-v="B">B 纸签</button>
    <button class="chip" data-v="C">C 玻璃</button>
    <button class="chip" data-v="D">D 墨键</button>
    <button class="chip" data-v="E">E 顶栏</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div class="stage"><div class="device" id="dev"></div></div>

<script>
var ICO = {
  flow:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  wallet:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10.5h18M16 15h2"/></svg>',
  gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>',
  plus:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/>'
};
var DAYS = [
  { m:11, d:2, w:'周日', rows:[] },
  { m:11, d:3, w:'周一', rows:[
    { icon:'Croissant', t:'好利来', s:'吃 · 花呗', a:26.00, bg:'#FFF1E6' },
    { icon:'LightRail', t:'地铁', s:'行 · 建行5044', a:4.00, bg:'#EAF2FF' }
  ]},
  { m:11, d:4, w:'周二', rows:[
    { icon:'Cat', t:'麦富迪猫粮', s:'情 · 白条', a:129.00, bg:'#F3EEFF' }
  ]},
  { m:11, d:5, w:'周三', rows:[
    { icon:'HotBeverage', t:'星巴克', s:'吃 · 花呗', a:28.00, bg:'#FFF1E6' },
    { icon:'Taxi', t:'滴滴', s:'行 · 招行', a:19.50, bg:'#EAF2FF' }
  ]},
  { m:11, d:6, w:'今天', today:true, rows:[
    { icon:'Croissant', t:'好利来', s:'吃 · 花呗', a:32.00, bg:'#FFF1E6' },
    { icon:'LightRail', t:'地铁', s:'行 · 建行5044', a:4.00, bg:'#EAF2FF' },
    { icon:'Cat', t:'麦富迪猫粮', s:'情 · 白条', a:129.00, bg:'#F3EEFF' }
  ]}
];
var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function money(n){ return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function pad2(n){ return String(n).padStart(2,'0'); }

function cardHTML(day){
  var sum = day.rows.reduce(function(a,r){ return a + r.a; }, 0);
  var rows = day.rows.length
    ? day.rows.map(function(r){
        return '<div class="tx"><div class="ic" style="background:' + r.bg + '">'
          + '<img src="../../assets/emoji/picked/' + r.icon + '.png" alt="">'
          + '</div><div><div class="tt">' + r.t + '</div><div class="ts">' + r.s + '</div></div>'
          + '<div class="ta">−¥' + money(r.a) + '</div></div>';
      }).join('')
    : '<div class="empty">没花钱的一天 :)<small>右滑可以看到昨天之前</small></div>';
  var head = '<div class="ch"><div class="dwrap"><span class="mon">' + MON[day.m-1] + '</span>'
    + '<span class="dnum">' + pad2(day.d) + '</span><span class="wday">' + day.w + '</span></div>'
    + (sum > 0 ? '<div class="totals"><span class="lbl">支出</span><span class="exp">−¥' + money(sum) + '</span></div>' : '')
    + '</div>';
  var note = day.today ? '<span class="note">本月 <s>↘ 12.4%</s></span>' : '';
  return '<div class="card">' + note + head + '<div class="hr"></div><div class="rows">' + rows + '</div></div>';
}

var dev = document.getElementById('dev');
var cardsHTML = '';
for (var i = 0; i < DAYS.length; i++) cardsHTML += cardHTML(DAYS[i]);

function tabHTML(cls, sel){
  return '<div class="' + cls + '">'
    + '<i class="' + (sel === 0 ? 'on' : '') + '">' + ICO.flow + '</i>'
    + '<i class="' + (sel === 1 ? 'on' : '') + '">' + ICO.wallet + '</i>'
    + '<i class="' + (sel === 2 ? 'on' : '') + '">' + ICO.gear + '</i>'
    + '</div>';
}

dev.innerHTML = '<div class="screen">'
  + '<div class="statusbar"><span>9:41</span><span><i></i></span></div>'
  + '<div class="hd"><span class="logo">DooDoo</span>'
  +   '<span class="htabs"><i class="on">' + ICO.flow + '</i><i>' + ICO.wallet + '</i><i>' + ICO.gear + '</i></span>'
  + '</div>'
  + '<div class="deck">' + cardsHTML + '</div>'
  + tabHTML('navA', 0) + tabHTML('navB', 0) + tabHTML('navC', 0) + tabHTML('navD', 0)
  + '<div class="fab">' + ICO.plus + '</div></div>';

var deck = dev.querySelector('.deck');
var cards = [].slice.call(dev.querySelectorAll('.card'));
var idx = cards.length - 1, dx = 0, down = false, sx = 0, sy = 0, axis = null, lx = 0, lt = 0, vel = 0;
var LAYCLS = { '0':'lay0', '-1':'lay1', '-2':'lay2', '-3':'lay3' };
var DECOR = { r:[-1.0,0.9,-1.3], x:[-5,4,-4], fr:[1.0,-1.2,1.4], fx:[-2,2,-2], lift:[4,3,2] };
var peelP = 0;
function rel(){ cards.forEach(function(c, i){ c.dataset.rel = i - idx; }); }
function paint(){
  cards.forEach(function(c){
    var r = +c.dataset.rel;
    c.className = 'card ' + (LAYCLS[r] || 'layX');
  });
}
function layout(d, animate, fanP){
  var p = fanP || 0;
  var cf = animate ? 'transform .36s cubic-bezier(.32,.72,0,1),opacity .22s,left .36s cubic-bezier(.32,.72,0,1),right .36s cubic-bezier(.32,.72,0,1),bottom .36s cubic-bezier(.32,.72,0,1)' : 'none';
  cards.forEach(function(card){
    var r = +card.dataset.rel, tr;
    card.style.transition = cf;
    if (r === 0){ tr = 'translateX(' + d + 'px) rotate(' + (d / 110) + 'deg)'; }
    else if (r < 0 && r >= -3){
      var k = -r;
      tr = 'translateX(' + (DECOR.x[k-1] + p * DECOR.fx[k-1]) + 'px)'
         + ' translateY(' + (-DECOR.lift[k-1] * peelP) + 'px)'
         + ' rotate(' + (DECOR.r[k-1] + p * DECOR.fr[k-1]) + 'deg)';
    } else { tr = 'translateX(420px)'; }
    card.style.transform = tr;
  });
}
function settle(){
  var w = deck.clientWidth;
  var moved = Math.abs(dx) > w * 0.22 || Math.abs(vel) > 0.55;
  if (moved && dx > 0 && idx > 0) idx--;
  else if (moved && dx < 0 && idx < cards.length - 1) idx++;
  dx = 0; vel = 0; peelP = 0;
  rel(); paint(); layout(0, true, 0);
}
function scaleFactor(){ return dev.getBoundingClientRect().width / 390; }
dev.addEventListener('pointerdown', function(e){
  down = true; sx = e.clientX; sy = e.clientY; axis = null; lx = 0; lt = performance.now(); vel = 0;
  cards.forEach(function(c){ c.style.transition = 'none'; });
});
window.addEventListener('pointermove', function(e){
  if (!down) return;
  var s = scaleFactor() || 1;
  var d = (e.clientX - sx) / s, dy = (e.clientY - sy) / s;
  if (!axis && (Math.abs(d) > 8 || Math.abs(dy) > 8)) axis = Math.abs(d) > Math.abs(dy) ? 'x' : 'y';
  if (axis !== 'x') return;
  dx = d;
  if ((dx > 0 && idx === 0) || (dx < 0 && idx === cards.length - 1)) dx *= 0.30;
  var now = performance.now();
  if (now - lt > 16){ vel = (dx - lx) / (now - lt); lx = dx; lt = now; }
  var w = deck.clientWidth;
  var p = Math.min(1, Math.abs(dx) / (w * 0.45));
  peelP = Math.min(1, Math.abs(dx) / (w * 0.5));
  layout(dx, false, p);
});
window.addEventListener('pointerup', function(){
  if (!down) return; down = false;
  if (axis !== 'x'){ dx = 0; peelP = 0; layout(0, true, 0); return; }
  settle();
});
window.addEventListener('pointercancel', function(){ if (!down) return; down = false; dx = 0; peelP = 0; layout(0, true, 0); });

var HINTS = {
  A:'无容器：三个裸图标 + 选中墨点。零容器 = 零层级，靠墨点读选中',
  B:'三张独立纸签，选中那张抬起 4pt。与卡堆同一套纸材质',
  C:'玻璃胶囊：毛玻璃 + 淡墨图标。最接近 index.html 最初的形态',
  D:'墨键（现状）：纯黑实心，全屏第二重元素 —— 对照组',
  E:'顶栏：底部只留 +，tab 进页头。零遮挡，代价是够不到'
};
function setVariant(v){
  document.body.className = 'v' + v;
  var chips = document.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('on', chips[i].dataset.v === v);
  document.getElementById('hint').textContent = HINTS[v];
}
document.getElementById('chips').addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if (c) setVariant(c.dataset.v);
});
function fit(){
  var s = Math.min((window.innerWidth - 40) / 390, (window.innerHeight - 52 - 36) / 844, 1);
  dev.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
rel(); paint(); layout(0, false, 0); fit(); setVariant('A');
</script>
</body>
</html>
