<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>卡堆修正 · 四版对照</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#EDEAE4;font-family:-apple-system,"PingFang SC",sans-serif;color:#1D1C1A;padding:20px 24px}
  .row{display:flex;gap:20px;align-items:flex-start}
  .col{width:286px}
  .hd{display:flex;align-items:baseline;gap:6px;margin-bottom:7px;white-space:nowrap}
  .hd b{font-size:12.5px}
  .hd em{font-style:normal;font-size:10.5px;color:#8A867D}
  .tag{font-size:9.5px;padding:2px 6px;border-radius:999px;font-weight:600}
  .bad{background:#FBEDEB;color:#B4443A}
  .ok{background:#EAF3EC;color:#2F7A48}
  .mid{background:#FCF6E6;color:#8A6D2F}
  img.shot{width:286px;display:block;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.10)}
  .cuts{display:flex;gap:20px;margin-top:18px}
  .cut{width:286px}
  .cut img{width:286px;display:block;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .cut .lb{font-size:10.5px;color:#6F6B63;margin-bottom:5px}
</style>
</head>
<body>
<div class="row">
  <div class="col">
    <div class="hd"><b>S1</b><em>现状 10pt</em><span class="tag bad">数不清</span></div>
    <img class="shot" src="dk-s1.png" alt="">
  </div>
  <div class="col">
    <div class="hd"><b>S2</b><em>14pt + 灰阶</em><span class="tag ok">推荐</span></div>
    <img class="shot" src="dk-s2.png" alt="">
  </div>
  <div class="col">
    <div class="hd"><b>S3</b><em>24pt 硬层厚</em><span class="tag mid">清楚但笨重</span></div>
    <img class="shot" src="dk-s3.png" alt="">
  </div>
  <div class="col">
    <div class="hd"><b>S4</b><em>侧向露边</em><span class="tag bad">无效</span></div>
    <img class="shot" src="dk-s4.png" alt="">
  </div>
</div>
<div class="cuts">
  <div class="cut"><div class="lb">S1 底部细节</div><img src="dk-cut-s1.png" alt=""></div>
  <div class="cut"><div class="lb">S2 底部细节</div><img src="dk-cut-s2.png" alt=""></div>
  <div class="cut"><div class="lb">S3 底部细节</div><img src="dk-cut-s3.png" alt=""></div>
</div>
</body>
</html>
