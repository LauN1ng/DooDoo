<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DooDoo · 导航层级校准</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#EDEAE4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1D1C1A;display:flex;flex-direction:column;align-items:center}

  .bar{width:100%;height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #E2DFD9;background:#F4F1EC;overflow:hidden}
  .brand{font-size:13px;font-weight:650;white-space:nowrap}
  .chips{display:flex;gap:6px;flex:0 0 auto}
  .chip{border:1px solid #DEDAD2;background:#FBFAF7;color:#4A4741;font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.16s;white-space:nowrap}
  .chip.on{background:#1D1C1A;color:#fff;border-color:#1D1C1A}
  .hint{margin-left:auto;font-size:11.5px;color:#8A867D;line-height:1.45;max-width:600px;overflow:hidden}

  .stage{flex:1;min-width:0;min-height:0;width:100%;position:relative;overflow:hidden}
  .device{position:absolute;left:50%;top:20px;margin-left:-195px;width:390px;height:844px;transform-origin:top center}
  .screen{position:absolute;inset:0;overflow:hidden;border-radius:44px;background:#F7F5F1;box-shadow:0 0 0 1px #DAD6CE,0 30px 70px rgba(0,0,0,.16)}

  .statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;z-index:90}
  .statusbar i{display:block;width:15px;height:9px;border:.8px solid #1D1C1A;border-radius:2px;position:relative}
  .statusbar i::after{content:"";position:absolute;inset:1.5px;background:#1D1C1A;border-radius:1px}

  .hd{position:absolute;top:52px;left:20px;right:20px;height:34px;display:flex;align-items:center;z-index:50}
  .hd .logo{font-size:21px;font-weight:700;letter-spacing:-.02em}

  /* deck 底距由变体决定：卡片本身铺到哪儿，tab 就压在哪儿 */
  .deck{position:absolute;top:100px;left:0;right:0;bottom:var(--db,12px)}

  .card{position:absolute;left:16px;right:16px;top:0;bottom:0;background:#fff;border-radius:24px;
        padding:20px 18px var(--cp,26px);display:flex;flex-direction:column;
        box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px rgba(0,0,0,.045)}

  .ch{display:flex;justify-content:space-between;align-items:flex-start}
  .dwrap{display:flex;align-items:baseline;gap:6px}
  .mon{font-size:11px;color:#A8A39A;letter-spacing:.08em}
  .dnum{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .wday{font-size:12px;color:#A8A39A}
  .totals{display:flex;align-items:baseline;gap:6px}
  .totals .lbl{font-size:11px;color:#A8A39A}
  .totals .exp{font-size:16px;font-weight:600;color:#C0392B;font-variant-numeric:tabular-nums}
  .hr{height:1px;background:#EFECE5;margin:14px 0 2px}
  .rows{flex:1}
  .tx{display:flex;align-items:center;gap:12px;padding:11px 0}
  .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 42px}
  .ic img{width:27px;height:27px;display:block}
  .tt{font-size:14px;font-weight:500}
  .ts{font-size:11.5px;color:#A8A39A;margin-top:2px}
  .ta{margin-left:auto;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .cardfoot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#B0ACA3;padding-top:12px;padding-bottom:2px}

  /* ---------- 导航元件：位置四种变体共用，只改材质与底距 ---------- */
  .nav{
    position:absolute;left:16px;bottom:var(--nb,26px);height:44px;z-index:60;
    display:flex;align-items:center;gap:2px;padding:0 7px;border-radius:22px;
  }
  .nav .t{width:38px;height:38px;display:grid;place-items:center;border-radius:19px;position:relative}
  .fab{
    position:absolute;right:18px;bottom:var(--fb,30px);width:52px;height:52px;border-radius:50%;z-index:60;
    display:grid;place-items:center;
  }

  /* ============ 1 参照组：都在卡片外，靠空气分隔 ============ */
  .s1 .nav{
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
    box-shadow:0 8px 22px rgba(29,28,26,.13),inset 0 0 0 .5px rgba(29,28,26,.08);
  }
  .s1 .nav .t{color:#8E8A82}
  .s1 .nav .t.on{color:#1D1C1A}
  .s1 .nav .t.on::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#1D1C1A}
  .s1 .fab{background:#1D1C1A;color:#fff;box-shadow:0 10px 22px rgba(29,28,26,.26)}

  /* ============ 2 浅玻璃压进卡内 ============ */
  .s2 .nav{
    background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
    box-shadow:0 1px 1.5px rgba(29,28,26,.13),0 12px 30px rgba(29,28,26,.16),inset 0 0 0 .5px rgba(29,28,26,.07);
  }
  .s2 .nav .t{color:#8E8A82}
  .s2 .nav .t.on{color:#1D1C1A}
  .s2 .nav .t.on::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#1D1C1A}
  .s2 .fab{background:#1D1C1A;color:#fff;box-shadow:0 2px 4px rgba(29,28,26,.20),0 14px 30px rgba(29,28,26,.28)}

  /* ============ 3 墨色实体压进卡内 ============ */
  .s3 .nav{
    background:#1D1C1A;
    box-shadow:0 1px 1.5px rgba(29,28,26,.24),0 14px 30px rgba(29,28,26,.30),inset 0 0 0 .5px rgba(255,255,255,.10);
  }
  .s3 .nav .t{color:rgba(255,255,255,.56)}
  .s3 .nav .t.on{color:#fff;background:rgba(255,255,255,.13)}
  .s3 .fab{background:#fff;color:#1D1C1A;box-shadow:0 2px 4px rgba(29,28,26,.16),0 14px 30px rgba(29,28,26,.24)}

  /* ============ 4 跨卡片下边缘 ============ */
  .s4 .nav{
    background:rgba(255,255,255,.80);
    -webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
    box-shadow:0 1px 1px rgba(29,28,26,.10),0 10px 24px rgba(29,28,26,.15),0 3px 8px rgba(29,28,26,.09),inset 0 0 0 .5px rgba(29,28,26,.07);
  }
  .s4 .nav .t{color:#8E8A82}
  .s4 .nav .t.on{color:#1D1C1A}
  .s4 .nav .t.on::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#1D1C1A}
  .s4 .fab{background:#1D1C1A;color:#fff;box-shadow:0 2px 4px rgba(29,28,26,.20),0 14px 30px rgba(29,28,26,.26)}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">导航层级校准</div>
  <div class="chips" id="chips">
    <button class="chip" data-v="s1">1 各站一层（现状）</button>
    <button class="chip on" data-v="s2">2 玻璃压卡</button>
    <button class="chip" data-v="s3">3 墨色压卡</button>
    <button class="chip" data-v="s4">4 跨卡沿</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div class="stage"><div class="device" id="dev"></div></div>

<script>
var ICO = {
  flow:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  wallet:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10.5h18M16 15h2"/></svg>',
  chart:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 19V11M12 19V6M19 19v-5"/></svg>',
  plus:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>'
};
var TX = [
  { ic:'Croissant', t:'好利来', s:'吃 · 花呗', a:'32.00', bg:'#FFF1E6' },
  { ic:'LightRail', t:'地铁', s:'行 · 建行5044', a:'4.00', bg:'#EAF2FF' },
  { ic:'Cat', t:'麦富迪猫粮', s:'情 · 白条', a:'129.00', bg:'#F3EEFF' }
];

function cardHTML(){
  var rows = TX.map(function(r){
    return '<div class="tx"><div class="ic" style="background:' + r.bg + '">'
      + '<img src="../../assets/emoji/picked/' + r.ic + '.png" alt="">'
      + '</div><div><div class="tt">' + r.t + '</div><div class="ts">' + r.s + '</div></div>'
      + '<div class="ta">−¥' + r.a + '</div></div>';
  }).join('');
  return '<div class="card">'
    + '<div class="ch"><div class="dwrap"><span class="mon">NOV</span><span class="dnum">06</span><span class="wday">今天</span></div>'
    + '<div class="totals"><span class="lbl">支出</span><span class="exp">−¥165.00</span></div></div>'
    + '<div class="hr"></div><div class="rows">' + rows + '</div>'
    + '<div class="cardfoot"><span>今天 · 11月6日</span><span>3 笔</span></div>'
    + '</div>';
}

var NAVBAR = '<div class="nav">'
  + '<span class="t on">' + ICO.flow + '</span>'
  + '<span class="t">' + ICO.wallet + '</span>'
  + '<span class="t">' + ICO.chart + '</span></div>';
var FABB = '<div class="fab">' + ICO.plus + '</div>';

/* db=deck底距 cp=卡片底部内边距 nb=导航底距 fb=FAB底距 */
var V = {
  s1:{ db:74, cp:26, nb:16, fb:18,
       hint:'卡片和胶囊都落在页面背景上，中间隔 18pt 空气。没有遮挡、投影投在背景而不是卡面 → 只能读成同一层。代价：卡片被挤短 62pt，屏幕底多一条横带。' },
  s2:{ db:12, cp:92, nb:26, fb:34,
       hint:'胶囊压进卡内 44pt，卡片底边在胶囊下方还露出 14pt。投影投在卡面上。层级读得出，但白玻璃浮在白卡上，色差只有 3%。' },
  s3:{ db:12, cp:92, nb:26, fb:34,
       hint:'墨色实体压进卡内 44pt，卡片底边照旧从下面露出 14pt。白卡面 vs 墨块，不用拆投影就能读出上下；和右侧 FAB 成一对墨色浮标。' },
  s4:{ db:44, cp:74, nb:22, fb:36,
       hint:'胶囊中心线正压在卡片下边缘：上半盖住卡面，下半落在背景。阴影同时投在两种底色上，卡片圆角从两侧钻出——跨界是层级最硬的证据。' }
};

var dev = document.getElementById('dev');
var hintEl = document.getElementById('hint');
var cur = 's2';

function render(){
  var v = V[cur];
  var st = '--db:' + v.db + 'px;--cp:' + v.cp + 'px;--nb:' + v.nb + 'px;--fb:' + v.fb + 'px';
  dev.innerHTML = '<div class="screen ' + cur + '" style="' + st + '">'
    + '<div class="statusbar"><span>9:41</span><span><i></i></span></div>'
    + '<div class="hd"><span class="logo">DooDoo</span></div>'
    + '<div class="deck">' + cardHTML() + '</div>'
    + NAVBAR + FABB
    + '</div>';
  hintEl.textContent = v.hint;
}

document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  [].slice.call(this.children).forEach(function(c){ c.classList.toggle('on', c === b); });
  cur = b.dataset.v; render();
});

function fit(){
  var s = Math.min((window.innerWidth - 40) / 390, (window.innerHeight - 56 - 40) / 844, 1);
  dev.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
render(); fit();
</script>
</body>
</html>
