<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DooDoo · 已定案部分原型</title>
<style>
  :root{
    --green:#34C759; --green-d:#1C8B3E;
    --ink:#111114; --i2:#6B6B73; --i3:#9A9AA2;
    --line:#EBEBEE; --bg:#F2F2F6; --card:#fff;
    --c-hang:#D4537E; --c-piao:#378ADD; --c-la:#534AB7; --c-npc:#9A9AA2;
    --s:.68;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{
    margin:0;background:#EDECE8;color:var(--ink);padding:44px 24px 64px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .board{max-width:980px;margin:0 auto}
  .board>header{max-width:640px;margin-bottom:34px}
  h1{font-size:26px;margin:0 0 10px;letter-spacing:-.4px;font-weight:600}
  .board>header p{margin:0;font-size:13.5px;line-height:1.75;color:#6B6B68}
  .board>header b{color:#111114;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(292px,1fr));gap:40px 20px;justify-items:center}
  figure{margin:0;width:calc(390px * var(--s))}
  .frame{width:calc(390px * var(--s));height:calc(844px * var(--s));position:relative;border-radius:calc(40px * var(--s));overflow:hidden;
    box-shadow:0 2px 5px rgba(0,0,0,.07),0 20px 44px -20px rgba(0,0,0,.32);background:#0E0E10}
  figcaption{margin-top:14px;font-size:13px;font-weight:600;letter-spacing:-.1px}
  figcaption span{display:block;font-size:12px;font-weight:400;color:#7A7A76;margin-top:3px;line-height:1.55}

  .phone{width:390px;height:844px;transform:scale(var(--s));transform-origin:top left;background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden}
  .sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13.5px;font-weight:600;flex:0 0 auto}
  .sb .r{display:flex;gap:4px;align-items:center}
  .sb .bar{width:17px;height:10px;border-radius:2px;background:currentColor;opacity:.9}
  .sb .bat{width:23px;height:11px;border-radius:3px;border:1.2px solid currentColor;position:relative}
  .sb .bat::after{content:"";position:absolute;inset:1.6px;background:currentColor;border-radius:1px}

  .body{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .pad{padding:0 22px}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 22px 0;flex:0 0 auto}
  .mon{font-size:15px;font-weight:600;letter-spacing:-.2px}
  .mon small{font-size:11px;color:var(--i3);font-weight:500;margin-left:5px}
  .icobtn{width:30px;height:30px;border-radius:50%;background:#E7E7EC;display:flex;align-items:center;justify-content:center}

  .lbl{font-size:12px;color:var(--i2);margin:16px 22px 0;letter-spacing:.02em}
  .big{font-size:40px;font-weight:600;letter-spacing:-1.3px;margin:2px 22px 0;font-variant-numeric:tabular-nums;line-height:1.05}
  .big .dec{font-size:26px}
  .delta{display:flex;align-items:center;gap:4px;margin:5px 22px 0;font-size:12.5px;font-weight:600;color:var(--green-d);font-variant-numeric:tabular-nums}

  .seg{display:flex;gap:3px;margin:6px 18px 0;justify-content:center}
  .seg span{font-size:12px;color:var(--i3);padding:5px 11px;border-radius:999px}
  .seg span.on{background:#E4E4E9;color:var(--ink);font-weight:500}

  .stack{margin:14px 22px 0;height:11px;border-radius:6px;overflow:hidden;display:flex;gap:2px}
  .stack i{display:block;height:100%}
  .legend{display:flex;margin:8px 22px 0;gap:10px;font-size:10.5px;color:var(--i2);flex-wrap:wrap}
  .legend b{font-weight:600;color:var(--ink)}
  .legend .d{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:3px;vertical-align:1px}

  .ghd{display:flex;align-items:center;justify-content:space-between;margin:16px 22px 0}
  .ghd span{font-size:11.5px;color:var(--i3);font-weight:600;letter-spacing:.06em}
  .ghd em{font-style:normal;font-size:11.5px;color:var(--i3)}

  .row{display:flex;align-items:center;gap:10px;padding:8px 22px}
  .ico{width:31px;height:31px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .meta{flex:1;min-width:0}
  .t1{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{font-size:11px;color:var(--i3);margin-top:1px}
  .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .amt.in{color:var(--green-d)}

  .tabbar{
    margin-top:auto;flex:0 0 auto;height:64px;background:rgba(255,255,255,.94);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;padding-bottom:8px;
    backdrop-filter:blur(12px);
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--i3)}
  .tab.on{color:var(--green-d);font-weight:600}
  .tab i{width:20px;height:20px;display:block}
  .plus{width:46px;height:46px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px -2px rgba(52,199,89,.5);margin-top:-18px}

  .seg2{display:flex;background:#E7E7EC;border-radius:12px;padding:3px;margin:10px 22px 0}
  .seg2 div{flex:1;text-align:center;font-size:13px;padding:7px 0;border-radius:9px;color:var(--i2);font-weight:500}
  .seg2 div.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}

  .cats{display:flex;gap:8px;margin:14px 18px 0;flex:0 0 auto}
  .cat{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .cat .sq{width:100%;aspect-ratio:1;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .cat .sq.on{background:var(--green);box-shadow:0 4px 12px -3px rgba(52,199,89,.55)}
  .cat span{font-size:10px;color:var(--i2);white-space:nowrap}
  .cat span.on{color:var(--ink);font-weight:600}

  .subs{display:flex;gap:7px;margin:12px 18px 0;overflow:hidden;flex:0 0 auto}
  .subs div{flex:0 0 auto;padding:7px 12px;border-radius:10px;background:#fff;font-size:11.5px;color:var(--i2);
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .subs div.on{background:#111114;color:#fff;font-weight:500}

  .money{font-size:44px;font-weight:600;letter-spacing:-1.5px;margin:16px 22px 0;color:var(--green-d);font-variant-numeric:tabular-nums;line-height:1}
  .money .cur{font-size:26px;margin-right:2px}

  .rate{margin:12px 18px 0;flex:0 0 auto}
  .rate .q{font-size:11px;color:var(--i3);margin:0 4px 6px}
  .chips{display:flex;gap:6px}
  .chip{flex:1;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:var(--i2);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .chip[data-k="hang"]{color:var(--c-hang)}
  .chip[data-k="piao"]{color:var(--c-piao)}
  .chip[data-k="la"]{color:var(--c-la)}
  .chip[data-k="npc"]{color:#7C7C84}
  .chip.on{color:#fff;box-shadow:none}
  .chip.on[data-k="hang"]{background:var(--c-hang)}
  .chip.on[data-k="piao"]{background:var(--c-piao)}
  .chip.on[data-k="la"]{background:var(--c-la)}
  .chip.on[data-k="npc"]{background:var(--c-npc)}

  .line-item{display:flex;align-items:center;gap:8px;margin:10px 22px 0;font-size:12.5px;color:var(--i2)}
  .line-item .k{flex:1}
  .line-item .v{color:var(--ink);font-weight:500}

  .keypad{margin:12px 10px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;flex:0 0 auto}
  .key{height:52px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .key.fn{background:#E2E2E7;font-size:16px}
  .key.ok{background:var(--green);color:#fff}
  .key .lab{font-size:11px;color:var(--i2);line-height:1.2;text-align:center}

  .sumrow{display:flex;margin:14px 22px 0;gap:10px}
  .sumrow div{flex:1;background:#fff;border-radius:14px;padding:11px 13px}
  .sumrow .k{font-size:10.5px;color:var(--i3)}
  .sumrow .v{font-size:19px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}

  .fchips{display:flex;gap:6px;margin:12px 18px 0}
  .fchips span{font-size:11.5px;padding:6px 12px;border-radius:999px;background:#fff;color:var(--i2);box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .fchips span.on{background:#111114;color:#fff;font-weight:500}

  .rank{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 18px 0}
  .rk{border-radius:16px;padding:12px 13px;color:#fff;position:relative;overflow:hidden}
  .rk .n{font-size:12px;opacity:.9;font-weight:600}
  .rk .c{font-size:22px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
  .rk .s{font-size:10.5px;opacity:.82;margin-top:3px;font-variant-numeric:tabular-nums}

  .bignum2{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="board">
  <header>
    <h1>DooDoo · 已定案部分</h1>
    <p>五屏分别是：<b>主页</b>（月度仪表 A 方案）、<b>记一笔</b>（含四档评分）、<b>账单</b>（按日分组 + 档位筛选）、<b>夯拉排行</b>、<b>账户详情</b>。配色按你定的：收入绿、支出用深色不用红，红只留给超支。</p>
  </header>

  <div class="grid">

    <figure>
      <div class="frame"><div class="phone">
        <div class="sb"><span>07:49</span><span class="r"><i class="bar"></i><i class="bat"></i></span></div>
        <div class="body">
          <div class="topbar">
            <span class="mon">11 月<small>2026</small></span>

          </div>

              <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#34C759" stop-opacity=".22"/><stop offset="100%" stop-color="#34C759" stop-opacity="0"/>

              <circle cx="344" cy="49" r="4.4" fill="#fff" stroke="#34C759" stroke-width="2.4"/>
            </svg>
          </div>
          <div class="seg"><span class="on">本月</span><span>近三月</span><span>全年</span></div>

          <div class="stack">

            <span><i class="d" style="background:var(--c-npc)"></i>NPC <b>9</b></span>
          </div>

          <div class="ghd"><span>今天</span><em>3 笔 · ¥224.40</em></div>
          <div class="row">
            <div class="ico" style="background:#FDEFF3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 9h12l-1 10.5a1 1 0 0 1-1 .9H8a1 1 0 0 1-1-.9z" stroke="#D4537E" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 9V6.5a3 3 0 0 1 6 0V9" stroke="#D4537E" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            <div class="meta"><div class="t1">星巴克</div><div class="t2">09:12 · 弹性支出 · 夯</div></div>
            <div class="amt">−¥32.00</div>
          </div>
          <div class="row">
            <div class="ico" style="background:#E9F4FD"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5.5 8.5h13l1.3 10.2a1 1 0 0 1-1 1.3H5.2a1 1 0 0 1-1-1.3z" stroke="#378ADD" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 9V6.8a3 3 0 0 1 6 0V9" stroke="#378ADD" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            <div class="meta"><div class="t1">盒马鲜生</div><div class="t2">12:40 · 生活所需 · 飘</div></div>
            <div class="amt">−¥186.40</div>
          </div>
          <div class="row">
            <div class="ico" style="background:#FBF0E4"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="6" y="4.5" width="12" height="13" rx="3" stroke="#BA7517" stroke-width="1.8"/><path d="M6 12.5h12" stroke="#BA7517" stroke-width="1.8"/><path d="M7.5 20.5l.8-3M16.5 20.5l-.8-3" stroke="#BA7517" stroke-width="1.7" stroke-linecap="round"/></svg></div>
            <div class="meta"><div class="t1">地铁</div><div class="t2">08:05 · 固定支出 · NPC</div></div>
            <div class="amt">−¥6.00</div>
          </div>
          <div class="ghd"><span>昨天</span><em>2 笔 · ¥2,458.00</em></div>
          <div class="row">
            <div class="ico" style="background:#F1EFFA"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4.5 10.5L12 4.5l7.5 6v9a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z" stroke="#534AB7" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
            <div class="meta"><div class="t1">房租</div><div class="t2">11-03 · 固定支出 · NPC</div></div>
            <div class="amt">−¥2,400.00</div>
          </div>
          <div class="row">
            <div class="ico" style="background:#FBF0E4"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="7" y="3.5" width="10" height="17" rx="2.5" stroke="#BA7517" stroke-width="1.8"/><path d="M10.5 18h3" stroke="#BA7517" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            <div class="meta"><div class="t1">话费</div><div class="t2">11-03 · 固定支出 · NPC</div></div>
            <div class="amt">−¥58.00</div>
          </div>

          <div class="tabbar">
            <span class="tab on"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></i>首页</span>
            <span class="tab"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 6h14M5 12h14M5 18h9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></i>账单</span>
            <span class="plus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 6v12M6 12h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span>
            <span class="tab"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 19V11M12 19V5M19 19v-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></i>排行</span>
            <span class="tab"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="3.4" stroke="currentColor" stroke-width="1.9"/><path d="M5 20c1.2-3.5 3.8-5.2 7-5.2s5.8 1.7 7 5.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></i>我的</span>
          </div>
        </div>
      </div></div>
      <figcaption>01 · 主页
        <span>方案 A：本月支出 + 预算线 + 夯拉比例条 + 今日流水，全部在首屏</span>
      </figcaption>
    </figure>

    <figure>
      <div class="frame"><div class="phone">
        <div class="sb"><span>07:49</span><span class="r"><i class="bar"></i><i class="bat"></i></span></div>
        <div class="body">
          <div class="seg2"><div class="on">支出</div><div>收入</div></div>

          <div class="cats">
            <div class="cat">
              <div class="sq on"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2.5" stroke="#fff" stroke-width="1.9"/><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg></div>

            <div class="cat">

          <div class="rate">

            <div class="chips">
              <div class="chip" data-k="hang">夯</div>
              <div class="chip" data-k="piao">飘</div>

          <div class="line-item">

          <div class="line-item">
            <span class="k">账户</span><span class="v">招商银行 8857</span>
          </div>
