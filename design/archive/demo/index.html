<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DooDoo 记账 · App Demo</title>
<style>
/* ===== 组装来源 =====
   首页卡堆     design/current/home-final.html（定稿）
   底部导航     nav-final.html 方案 A（墨键 + 独立 +，三 tab = 流水/资产/设置）
   记一笔       entry-options.html 方案 A（降密度版，62px 金额主角）
   资产页       account-stack.html 工作副本（卡堆 + 全屏磨砂浮层 + 账户详情 v0.3）
   便签         设计方向 v10 定稿（本月 ↘12.4%，仅今天卡显示）
   设置页       草案占位（未定稿） */
:root{
  --bg:#F7F5F1; --card:#fff; --ink:#1D1C1A; --ink2:#6B6862; --ink3:#9A968D; --ink4:#B0ACA3;
  --line:#EFECE5; --line2:#EAE7E0; --red:#C0392B; --green:#2E9E6B; --blue:#4C8DF6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#EDEAE4;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}

/* ===== demo 外壳 ===== */
.topbar{width:100%;height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 20px;
  border-bottom:1px solid #E2DFD9;background:#F4F1EC;overflow:hidden;z-index:5}
.brand{font-size:13px;font-weight:650;white-space:nowrap}
.hint{margin-left:auto;font-size:11.5px;color:#8A867D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:720px}
.stage{flex:1;min-width:0;min-height:0;width:100%;position:relative;overflow:hidden}
.device{position:absolute;left:50%;top:16px;margin-left:-195px;width:390px;height:844px;transform-origin:top center}
.screen{position:absolute;inset:0;overflow:hidden;border-radius:44px;background:var(--bg);
  box-shadow:0 0 0 1px #DAD6CE,0 30px 70px rgba(0,0,0,.16)}

/* ===== 全局状态栏 ===== */
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 26px 8px;font-size:13px;font-weight:600;z-index:90;pointer-events:none}
.statusbar .batt{width:22px;height:11px;border-radius:3px;border:1px solid rgba(29,28,26,.35);position:relative}
.statusbar .batt::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:70%;background:var(--ink);border-radius:1.5px}

/* ===== 页面容器 ===== */
.pg{position:absolute;inset:0;display:none}
.pg.on{display:block}

/* ============ 流水（首页 · home-final 定稿） ============ */
.hd{position:absolute;top:52px;left:20px;right:20px;height:34px;display:flex;align-items:center;z-index:50}
.hd .logo{font-size:21px;font-weight:700;letter-spacing:-.02em}
.deck{position:absolute;top:100px;left:0;right:0;bottom:8px}
.card{position:absolute;left:16px;right:16px;top:0;background:#fff;border-radius:24px;
  padding:20px 18px 24px;display:flex;flex-direction:column;transform-origin:bottom center}
.lay0{left:16px;right:16px;bottom:38px;z-index:40;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px rgba(0,0,0,.045)}
.lay1{left:26px;right:26px;bottom:28px;z-index:30;box-shadow:0 1px 0 rgba(29,28,26,.10),0 4px 8px rgba(29,28,26,.05),inset 0 0 0 1px rgba(29,28,26,.11)}
.lay2{left:25px;right:25px;bottom:18px;z-index:20;box-shadow:0 1px 0 rgba(29,28,26,.10),0 4px 8px rgba(29,28,26,.05),inset 0 0 0 1px rgba(29,28,26,.11)}
.lay3{left:28px;right:28px;bottom:8px;z-index:10;box-shadow:0 1px 0 rgba(29,28,26,.10),0 6px 16px rgba(29,28,26,.10),inset 0 0 0 1px rgba(29,28,26,.11)}
.lay1>*,.lay2>*,.lay3>*{opacity:0}
.layX{opacity:0;pointer-events:none;z-index:5}
.ch{display:flex;justify-content:space-between;align-items:flex-start}
.dwrap{display:flex;align-items:baseline;gap:6px}
.mon{font-size:11px;color:#A8A39A;letter-spacing:.08em}
.dnum{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1}
.wday{font-size:12px;color:#A8A39A}
.totals{display:flex;align-items:baseline;gap:6px}
.totals .lbl{font-size:11px;color:#A8A39A}
.totals .exp{font-size:16px;font-weight:600;color:#C0392B;font-variant-numeric:tabular-nums}
.hr{height:1px;background:#EFECE5;margin:14px 0 2px}
.rows{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 42px;font-size:20px}
.ic img{width:27px;height:27px;display:block}
.tt{font-size:14px;font-weight:500}
.ts{font-size:11.5px;color:#A8A39A;margin-top:2px}
.ta{margin-left:auto;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#B5B1A8;font-size:14px}
.empty small{font-size:11.5px;color:#C6C2B9}
/* 便签：v10 定稿，仅今天那张卡 */
.note{position:absolute;right:6px;top:-14px;transform:rotate(-3deg);background:#FFF7E0;border:1px solid #EFE2BE;
  border-radius:5px;padding:5px 10px;font-size:11px;color:#8A6D2F;box-shadow:0 3px 8px rgba(0,0,0,.09);z-index:6;white-space:nowrap}
.note s{text-decoration:none;color:#3B7A44}

/* ============ 导航 A（nav-final 定案）＝ app 级 chrome ============ */
.nav{position:absolute;left:16px;bottom:52px;height:36px;z-index:100;
  display:flex;align-items:center;gap:1px;padding:0 6px;border-radius:18px;background:rgba(29,28,26,.88);
  box-shadow:0 10px 22px rgba(29,28,26,.22)}
.nav .t{width:36px;height:30px;border:0;padding:0;background:transparent;font:inherit;cursor:pointer;
  display:grid;place-items:center;border-radius:15px;color:rgba(255,255,255,.5)}
.nav .t.on{color:#fff;background:rgba(255,255,255,.14)}
.fab{position:absolute;right:18px;bottom:47px;width:46px;height:46px;border-radius:23px;z-index:100;border:0;padding:0;
  background:#1D1C1A;color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 18px rgba(29,28,26,.22)}

/* ============ 资产页（account-stack 工作副本 v1.x） ============ */
.scroll{position:absolute;left:0;right:0;top:52px;bottom:0;overflow-y:auto;padding:8px 16px 110px}
.scroll::-webkit-scrollbar{display:none}
.sum{background:var(--card);border-radius:24px;padding:14px 14px 8px;
  box-shadow:0 1px 2px rgba(29,28,26,.03),0 8px 22px rgba(29,28,26,.05);margin-bottom:16px}
.sumtop{display:flex;gap:14px}
.sumcol{flex:1;min-width:0}
.sumcol .k{font-size:10px;color:var(--ink3);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.sumcol .k .dot{width:6px;height:6px;border-radius:50%}
.sumcol .v{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.sumcol .p{font-size:11px;margin-top:3px}
.up{color:var(--red)}
.down{color:var(--green)}
.chart{padding:8px 0 0}
.ranges{display:flex;gap:4px;padding:0 0 2px}
.rg{flex:1;border:0;background:transparent;font:inherit;font-size:10.5px;color:var(--ink3);padding:5px 0;border-radius:999px;cursor:pointer}
.rg.on{background:#F3F0EA;color:var(--ink);font-weight:600}
.grp{margin-bottom:18px}
.grph{display:flex;align-items:center;gap:8px;padding:0 4px 10px}
.grph .nm{font-size:15px;font-weight:650;letter-spacing:-.01em}
.grph .tt{font-size:11px;color:#8A867D;font-weight:400;letter-spacing:.01em}
.grph .tg{margin-left:auto;width:24px;height:24px;flex:0 0 24px;border:0;border-radius:50%;background:#EBE7E0;color:#5C594F;
  font:inherit;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding-bottom:1px}
.duebar{display:flex;align-items:baseline;justify-content:space-between;background:#fff;border-radius:12px;padding:10px 13px;
  margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.duebar .dl{font-size:10.5px;color:var(--ink3);margin-right:7px}
.duebar .dv{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.duebar .dn{font-size:10.5px;color:var(--ink3)}
.odstrip{background:#FDECEC;color:#A32D2D;border-radius:12px;padding:8px 12px;font-size:11px;line-height:1.5;margin-bottom:12px}
.odstrip b{font-weight:650}
.agg{display:flex;align-items:center;gap:13px;padding:0 4px}
.hdeck{position:relative;width:146px;height:116px;flex:0 0 146px;cursor:pointer}
.hc{position:absolute;left:50%;margin-left:-66px;width:132px;height:82px;border-radius:13px;
  background:linear-gradient(135deg,var(--c1),var(--c2));transform-origin:bottom center;
  box-shadow:0 2px 7px rgba(29,28,26,.17),inset 0 0 0 .5px rgba(255,255,255,.16)}
.hc.back{border-radius:13px;box-shadow:0 -1px 0 rgba(255,255,255,.50),0 2px 6px rgba(29,28,26,.16),inset 0 0 0 .5px rgba(255,255,255,.22);
  filter:brightness(var(--bk,.88))}
.hc.k2{bottom:0;margin-left:-70px;transform:rotate(-1deg);z-index:1}
.hc.k1{bottom:16px;margin-left:-62px;transform:rotate(.8deg);z-index:2}
.hc.k0{bottom:32px;z-index:3;padding:10px 12px 0;display:flex;flex-direction:column;overflow:hidden}
.hcn{font-size:12.5px;font-weight:650;color:#fff;letter-spacing:-.01em;line-height:1.2}
.hcs{font-size:9.5px;color:rgba(255,255,255,.76);margin-top:3px;letter-spacing:.04em}
.hcf{margin-top:auto;display:flex;justify-content:flex-end;padding-bottom:7px}
.hcf .net{font-size:7pt;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.55)}
.hprog{height:2.5px;border-radius:2px;background:rgba(255,255,255,.32);margin-bottom:9px;flex:0 0 auto}
.hprog i{display:block;height:100%;background:rgba(255,255,255,.95);border-radius:2px}
.cnt{position:absolute;right:9px;bottom:6px;z-index:9;min-width:23px;height:23px;padding:0 6px;border-radius:999px;
  background:#1D1C1A;color:#fff;font-size:11px;font-weight:650;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(29,28,26,.30)}
.aggr{flex:1;min-width:0}
.aggr .k{font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
.aggr .v{font-size:22px;font-weight:650;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap}
.aggr .v.red{color:var(--red)}
.aggr .m{font-size:9.5px;color:var(--ink3);margin-top:7px;line-height:1.5;letter-spacing:.01em}
.aggr .m b{color:var(--ink2);font-weight:600}
.aggfoot{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 0;font-size:10.5px;color:var(--ink3);cursor:pointer}
.aggfoot .arw{color:var(--ink4);font-size:12px}

/* 全屏磨砂浮层：不是 sheet，不是新页面 */
.ov{position:absolute;inset:0;z-index:60}
.ovfrost{position:absolute;inset:0;background:rgba(247,245,241,.42);
  -webkit-backdrop-filter:blur(12px) saturate(1.16);backdrop-filter:blur(12px) saturate(1.16);
  animation:maskIn .26s ease both}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.ovcls{position:absolute;top:53px;right:16px;z-index:4;width:30px;height:30px;border:0;border-radius:50%;
  background:rgba(29,28,26,.07);color:var(--ink2);font:inherit;font-size:13px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ovlist{position:absolute;left:0;right:0;top:92px;bottom:0;overflow-y:auto;padding:0 16px 34px;
  animation:listIn .32s cubic-bezier(.32,.72,0,1) both;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent 100%);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent 100%)}
@keyframes listIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ovlist::-webkit-scrollbar{display:none}
.orow{display:flex;align-items:center;gap:13px;padding:10px 0;cursor:pointer}
.orow:active{opacity:.62}
.obc{width:144px;height:96px;flex:0 0 144px;border-radius:15px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;padding:11px 12px 0;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 2px 7px rgba(29,28,26,.13),inset 0 0 0 .5px rgba(255,255,255,.16)}
.oflag{position:absolute;top:0;right:0;z-index:3;background:#fff;color:#A32D2D;font-size:9.5px;font-weight:700;
  letter-spacing:.05em;padding:4px 10px 5px;border-bottom-left-radius:12px;box-shadow:0 1px 2px rgba(29,28,26,.10)}
.onm{font-size:12.5px;font-weight:650;color:#fff;letter-spacing:-.01em;line-height:1.2}
.omt{font-size:9px;color:rgba(255,255,255,.76);margin-top:3px;letter-spacing:.01em}
.obot{margin-top:auto;display:flex;align-items:center;gap:6px;padding-bottom:13px;font-size:9px;color:rgba(255,255,255,.82);letter-spacing:.06em}
.onet{margin-left:auto;font-size:7.5px;font-weight:700;letter-spacing:.09em;opacity:.72}
.oprog{position:absolute;left:10px;right:10px;bottom:5px;height:3px;border-radius:2px;background:rgba(255,255,255,.30);z-index:2}
.oprog i{display:block;height:100%;background:rgba(255,255,255,.95);border-radius:2px}
.ocols{flex:1;display:flex;gap:8px;min-width:0}
.ocol{flex:1;min-width:0}
.ocol .k{font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
.ocol .v{font-size:16.5px;font-weight:650;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.ocol .v.up{color:var(--red)}
.ocol .v.down{color:var(--green)}
.ovend{text-align:center;font-size:10.5px;color:var(--ink4);padding:22px 0 6px;letter-spacing:.02em}

/* 账户详情页：真 push */
.dt{position:absolute;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;
  animation:dtIn .34s cubic-bezier(.32,.72,0,1) both}
@keyframes dtIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.dtbar{height:52px;flex:0 0 52px;display:flex;align-items:center;padding:0 6px 0 2px;gap:8px}
.dtback{width:38px;height:38px;flex:0 0 38px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:19px;
  line-height:1;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dtbar .tt{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.dtmore{margin-left:auto;width:38px;height:38px;border:0;background:transparent;color:var(--ink3);font:inherit;font-size:15px;cursor:pointer;border-radius:50%}
.dtscroll{flex:1;overflow-y:auto;padding:0 16px 40px}
.dtscroll::-webkit-scrollbar{display:none}
.dtcard{width:224px;height:141px;border-radius:20px;margin:4px auto 0;position:relative;overflow:hidden;
  display:flex;flex-direction:column;padding:16px 17px 0;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 12px 28px -10px rgba(29,28,26,.50),inset 0 0 0 .5px rgba(255,255,255,.18)}
.dtcard .cn{font-size:15px;font-weight:650;color:#fff;letter-spacing:-.01em}
.dtcard .ct{font-size:10.5px;color:rgba(255,255,255,.76);margin-top:3px}
.dtcard .cb{margin-top:auto;display:flex;align-items:center;padding-bottom:15px}
.dtcard .cnum{font-size:11px;color:rgba(255,255,255,.86);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.dtcard .cnet{margin-left:auto;font-size:8.5px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.70)}
.dtcard .cprog{position:absolute;left:17px;right:17px;bottom:7px;height:3px;border-radius:2px;background:rgba(255,255,255,.30)}
.dtcard .cprog i{display:block;height:100%;border-radius:2px;background:rgba(255,255,255,.95)}
.dtname{text-align:center;font-size:19px;font-weight:650;letter-spacing:-.025em;margin-top:18px}
.dtmeta{text-align:center;font-size:11px;color:var(--ink3);margin-top:6px}
.dtmeta.alarm{color:#A32D2D}
.dtmets{display:flex;gap:10px;margin-top:18px}
.dtm{flex:1;min-width:0;text-align:center}
.dtm .k{font-size:10.5px;color:var(--ink3);letter-spacing:.05em}
.dtm .v{font-size:21px;font-weight:650;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dtm .v.up{color:var(--red)}
.dtm .v.down{color:var(--green)}
.dtm .s{font-size:10px;color:var(--ink4);margin-top:4px}
.dtchart{margin-top:16px}
.dtcap{font-size:10px;color:var(--ink4);line-height:1.6;margin-top:7px;padding:0 2px}
.dtfresh{text-align:center;font-size:10.5px;color:var(--ink3);margin:16px 0 2px}
.dtfresh b{color:var(--ink2);font-weight:600}
.dtsec{margin-top:20px}
.dtsech{display:flex;align-items:center;gap:7px;padding:0 2px 9px}
.dtsech .h{font-size:13px;font-weight:650;letter-spacing:-.01em}
.dtsech .c{font-size:10.5px;color:var(--ink3)}
.seg2{display:inline-flex;margin-left:auto;background:#F1EEE7;border-radius:99px;padding:2px}
.seg2 button{border:0;background:transparent;font:inherit;font-size:10.5px;color:var(--ink3);
  padding:4px 10px;border-radius:99px;cursor:pointer;letter-spacing:.01em;line-height:1.3}
.seg2 button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(29,28,26,.13)}
.txsum{font-size:10px;color:var(--ink3);padding:0 2px 9px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.dtbox{background:#fff;border-radius:16px;padding:13px 14px;box-shadow:0 1px 2px rgba(29,28,26,.03),0 6px 18px rgba(29,28,26,.045)}
.limtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.limtop .a{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.limtop .b{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.limtrack{height:5px;border-radius:3px;background:#F1EDE6;margin:11px 0 9px;overflow:hidden}
.limtrack i{display:block;height:100%;border-radius:3px;background:var(--ink)}
.limhist{font-size:10px;color:var(--ink4);line-height:1.55}
.inst{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid #F2EFE8}
.inst:last-of-type{border-bottom:0}
.ipi{width:46px;height:27px;flex:0 0 46px;border-radius:8px;background:#F3F0EA;display:flex;align-items:center;
  justify-content:center;gap:1px;font-size:10px;font-weight:650;color:var(--ink2);font-variant-numeric:tabular-nums}
.ipi span{font-weight:400;color:var(--ink4)}
.iname{flex:1;min-width:0;font-size:12.5px;letter-spacing:-.01em}
.isub{font-size:9.5px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums}
.iamt{text-align:right;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.instfoot{font-size:10px;color:var(--ink3);line-height:1.7;padding:11px 2px 0;border-top:1px solid #F2EFE8}
.instfoot .ok{color:var(--green);font-weight:600}
.txbox{padding:2px 14px 0}
.txr{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #F5F2EC}
.txr .td{flex:0 0 38px;font-size:10px;color:var(--ink4);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.txr .tn{flex:1;min-width:0;font-size:12.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txr .tc{font-size:9.5px;color:var(--ink4);margin-left:6px;letter-spacing:0}
.txr .ta{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.txall{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:12px 0 13px;border:0;

  var p = fanP || 0;

      tr = 'translateX(' + d + 'px) rotate(' + (d / 110) + 'deg)';

      var k = -r;
      tr = 'translateX(' + (DECOR.x[k-1] + p * DECOR.fx[k-1]) + 'px)'
         + ' translateY(' + (-DECOR.lift[k-1] * peelP) + 'px)'
         + ' rotate(' + (DECOR.r[k-1] + p * DECOR.fr[k-1]) + 'deg)';

  if (now - lt > 16){ vel = (dx - lx) / (now - lt); lx = dx; lt = now; }

    +     '<div class="cb"><span class="cnum">' + a.num + '</span><span class="cnet">' + (a.net || '') + '</span></div>'
    +     (isCredit ? '<div class="cprog"><i style="width:' + (a.u || 0) + '%"></i></div>' : '')
    +   '</div>'
    +   '<div class="dtname">' + title + '</div>'
    +   '<div class="dtmeta' + (a.od ? ' alarm' : '') + '">' + (a.od ? a.od + ' · 8 月账单 665.36 未还' : a.m) + '</div>'
    +   '<div class="dtmets">'
    +     '<div class="dtm"><div class="k">' + m1k + '</div><div class="v">' + m1v + '</div><div class="s">' + m1s + '</div></div>'
    +     '<div class="dtm"><div class="k">' + m2k + '</div><div class="v' + m2c + '">' + m2v + '</div><div class="s">' + m2s + '</div></div>'
    +   '</div>'

    +   '<div class="dtcap">' + (isCredit ? '每月还款后的欠款余额。' : '每月末余额。')
    +     (a.od ? '红点是 8 月账单漏还的开始——那 665.36 一直挂着，其余照常还。' : '') + '</div>'
    +   '<div class="ranges" style="margin-top:10px">'

    +   '<div class="dtfresh">最后对账 <b>昨天 22:58</b></div>'
    +   limsec + instsec + txsec
    +   '<button class="dtbtn">编辑账户</button>'
    + '</div></div>';
}
var pgAsset = document.getElementById('pg-asset');
function assetScreenHTML(){

    + '<div class="sum">'
    +   '<div class="sumtop">'
    +     '<div class="sumcol"><div class="k"><span class="dot" style="background:#3A9E6B"></span>我有</div>'
    +       '<div class="v">3,120.00</div><div class="p down">↘ 2.3%</div></div>'
    +     '<div class="sumcol"><div class="k"><span class="dot" style="background:#E8734A"></span>我欠</div>'
    +       '<div class="v">28,466.00</div><div class="p up">↗ 4.1%</div></div>'
    +   '</div>'
    +   '<div class="chart"><svg viewBox="0 0 320 44" width="100%" height="44" preserveAspectRatio="none">'
    +     '<polyline points="2,33 40,33 80,32 120,29 160,30 200,27 240,25 280,22 316,21" fill="none" stroke="#4C8DF6" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'
    +     '<polyline points="2,12 40,13 80,13 120,16 160,15 200,18 240,17 280,20 316,19" fill="none" stroke="#E8734A" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'

    + '</div>'
    + groupBlock('credit', '信用', C, CREDIT_TOTAL, true)
    + groupBlock('saving', '储蓄', Sv, SAVING_TOTAL, false)
    + '</div>';
  if (stateA.ov) h += overlayHTML(stateA.ov);
  if (stateA.page) h += detailHTML(stateA.page.g, stateA.page.i);
  return h;
}
function renderAsset(){
  var old = pgAsset.querySelector('.scroll');
  var keep = old ? old.scrollTop : 0;
  var odt = pgAsset.querySelector('.dtscroll');
  var keepDt = odt ? odt.scrollTop : 0;
  pgAsset.innerHTML = assetScreenHTML();
  var nw = pgAsset.querySelector('.scroll');
  if (nw) nw.scrollTop = keep;
  var ndt = pgAsset.querySelector('.dtscroll');
  if (ndt) ndt.scrollTop = keepDt;
}
pgAsset.addEventListener('click', function(e){
  if (e.target.closest('[data-dclose]')){
    stateA.page = null; renderAsset(); return;
  }
  if (e.target.closest('[data-close]')){
    stateA.ov = null; stateA.page = null; renderAsset(); return;
  }
  var tm = e.target.closest('[data-txmode]');
  if (tm && stateA.page){
    stateA.page.mode = tm.dataset.txmode;
    stateA.page.more = 10;
    if (stateA.page.mode === 'cur') stateA.page.more = 0;
    renderAsset(); return;
  }
  var tmore = e.target.closest('[data-txmore]');
  if (tmore && stateA.page){
    stateA.page.more = ((stateA.page.more) || 10) + 10;
    renderAsset(); return;
  }
  var row = e.target.closest('[data-g]');
  if (row){
    stateA.page = { g: row.dataset.g, i: +row.dataset.i }; renderAsset(); return;
  }
  var op = e.target.closest('[data-open]');
  if (op){ stateA.ov = op.dataset.open; stateA.page = null; renderAsset(); }
});

/* ================= 记一笔（entry A · 降密度版） ================= */
var entryLayer = document.getElementById('entryLayer');
var E = { open:false };
function kindsHTML(){
  return '<div class="kinds"><div class="ktabs">' + TYPES.map(function(t){
    return '<button data-act="type" data-val="'+t.k+'" class="'+(S.type===t.k?'on':'')+'">'+t.n+'</button>';
  }).join('') + '</div><span class="kdate">今天 · 11/6</span></div>';
}
function amtHTML(){
  var a = S.amount === '' ? '0' : S.amount;
  return '<div class="amt" data-act="amt"><span class="cur">¥</span><span class="num">'+a+'</span><i class="caret"></i></div>';
}
function catStripHTML(){
  var list = S.type==='income' ? INCOMES : CATS;
  return '<div class="catstrip">' + list.map(function(c){
    return '<div class="catitem '+(S.cat===c.k?'on':'')+'" data-act="cat" data-val="'+c.k+'">'
      + '<div class="box" style="background:'+c.bg+'">'+c.e+'</div><span>'+c.k+'</span></div>';
  }).join('') + '</div>';
}
function accPillsHTML(){
  return '<div class="pills">' + ACCS.map(function(a){
    return '<button class="pill '+(S.acc===a.n?'on':'')+'" data-act="acc" data-val="'+a.n+'">'+a.n+'</button>';
  }).join('') + '</div>';
}
function gradeDotsHTML(){
  return '<div class="gdots">' + GRADES.map(function(g){
    return '<button class="gdot '+(S.grade===g.k?'on':'')+'" data-act="grade" data-val="'+g.k+'">'+g.e+'<b>'+g.k+'</b></button>';
  }).join('') + '<button class="gskip" data-act="grade" data-val="">跳过</button></div>';
}
function rowA(label, inner){
  return '<div class="frow"><span class="fk">'+label+'</span><div class="fv">'+inner+'</div></div>';
}
function dynamicRowsA(){
  if(S.type==='repay'){
    return rowA('还哪张卡','<div class="pills"><button class="pill on">招行 8857</button><button class="pill">花呗</button><button class="pill">白条</button></div>')
      + rowA('', '<span class="tagmini">不计支出 · 这笔属 11 月账单第 3 期</span>')
      + rowA('扣款', accPillsHTML());
  }
  if(S.type==='transfer'){
    return rowA('转出', '<div class="pills"><button class="pill on">微信余额 → 建行 5044</button></div>')
      + rowA('', '<span class="tagline">转出 ¥1,000.00　到账 ¥999.90　<span style="color:var(--red)">手续费 ¥0.10</span> 自动记一笔支出</span>');
  }
  return rowA(S.type==='income'?'收入':'分类', catStripHTML())
    + rowA(S.type==='income'?'存入':'账户', accPillsHTML())
    + (S.type==='expense' ? rowA('值不值', gradeDotsHTML()) : '');
}
function metaHTML(){
  return '<div class="meta"><span data-act="noop">备注 · 加一笔</span><i></i>'
    + '<span data-act="noop">今天 · 可改</span><i></i>'
    + '<span data-act="noop">分期 ✓</span></div>';
}
function kbHTML(){
  var rows = [['7','8','9','del'],['4','5','6','C'],['1','2','3','00'],['.','0','ok']];
  var labels = {del:'⌫',C:'C'};
  return '<div class="kb">' + rows.map(function(r){
    return r.map(function(k){
      if(k==='ok') return '<button class="ok" data-act="key" data-val="ok">完成 <span>↵</span></button>';
      return '<button data-act="key" data-val="'+k+'">'+(labels[k]||k)+'</button>';
    }).join('');
  }).join('') + '</div>';
}
function entryHTML(){
  return '<div class="entry va">'
    + '<div class="ghost"><div class="gd">06</div><div class="gr"></div><div class="gr s"></div></div>'
    + '<div class="lay"></div><div class="lay l2"></div>'
    + '<div class="paper">'
      + '<div class="grabrow"><span class="grab"></span><button class="close" data-act="close">×</button></div>'
      + kindsHTML()
      + amtHTML()
      + dynamicRowsA()
      + metaHTML()
      + kbHTML()
    + '</div></div>';
}
function renderEntry(){
  if (E.open) entryLayer.innerHTML = entryHTML();
  else entryLayer.innerHTML = '';
}
function closeEntry(){ E.open = false; renderEntry(); }
function keyfn(k){
  var a = S.amount;
  if(k==='C'){ S.amount=''; return; }
  if(k==='del'){ S.amount = a.slice(0,-1); return; }
  if(k==='.'){ if(a.indexOf('.')<0) S.amount = (a||'0')+'.'; return; }
  var parts = a.split('.');
  if(parts[1] && parts[1].length>=2) return;
  if(k==='00'){
    if(parts[1] && parts[1].length>=1) return;
    S.amount = (a===''||a==='0') ? '0' : a+'00';
    return;
  }
  S.amount = (a===''||a==='0') ? k : a+k;
}
function saveEntry(){
  var v = parseFloat(S.amount) || 0;
  var cat = curCat();
  var row;
  if (S.type === 'repay'){
    row = { ch:'💳', bg:'#FDEEF0', t:'还款', s:'还款 · 招行 8857 · 不计支出', a:v };
  } else if (S.type === 'transfer'){
    row = { ch:'🔁', bg:'#F3F1EE', t:'转账', s:'转账 · 微信余额 → 建行 5044', a:v };
  } else {
    row = { ch:cat.e, bg:cat.bg, t:cat.k, s:cat.k + ' · ' + S.acc, a:v, income:S.type==='income' };
  }
  DAYS[TODAY_IDX].rows.push(row);
  cards[TODAY_IDX].innerHTML = cardInner(DAYS[TODAY_IDX]);
  closeEntry();
  idx = cards.length - 1; rel(); paint(); layout(0, true, 0);
  toast('已记下 · ' + typeName() + ' ¥' + money(v));
}
entryLayer.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el) return;
  var act = el.dataset.act, val = el.dataset.val;
  if(act==='type'){ S.type=val; S.cat = val==='income' ? '工资' : '吃'; renderEntry(); }
  else if(act==='cat'){ S.cat=val; renderEntry(); }
  else if(act==='acc'){ S.acc=val; renderEntry(); }
  else if(act==='grade'){ S.grade=val; renderEntry(); }
  else if(act==='key'){ if(val==='ok'){ saveEntry(); } else { keyfn(val); renderEntry(); } }
  else if(act==='close'){ closeEntry(); }
});

/* ================= toast ================= */
var toastEl = document.getElementById('toast');
var toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 1900);
}

/* ================= tab / FAB ================= */
var state = { tab:'flow' };
var navBtns = [].slice.call(document.querySelectorAll('.nav .t'));
function setTab(t){
  state.tab = t;
  stateA.ov = null; stateA.page = null;
  closeEntry();
  pgFlow.classList.toggle('on', t === 'flow');
  pgAsset.classList.toggle('on', t === 'asset');
  pgSet.classList.toggle('on', t === 'settings');
  navBtns.forEach(function(b){ b.classList.toggle('on', b.dataset.tab === t); });
  if (t === 'asset') renderAsset();
}
document.getElementById('nav').addEventListener('click', function(e){
  var b = e.target.closest('.t'); if(!b) return;
  setTab(b.dataset.tab);
});
document.getElementById('fab').addEventListener('click', function(){
  E.open = true; renderEntry();
});

/* ================= fit ================= */
var dev = document.getElementById('dev');
function fit(){
  var s = Math.min((window.innerWidth - 40) / 390, (window.innerHeight - 52 - 36) / 844, 1);
  dev.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();
setTab('flow');
</script>
